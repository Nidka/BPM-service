    get:
      tags: [Operación diaria]
      operationId: listOperationPlans
      summary: Consultar planes de limpieza
      security: [{FirebaseBearer: []}]
      parameters:
        - {$ref: "#/components/parameters/PageSize"}
        - {$ref: "#/components/parameters/PageToken"}
        - {$ref: "#/components/parameters/SearchQuery"}
        - in: query
          name: locationId
          required: true
          schema: {type: string, format: uuid}
        - in: query
          name: view
          required: false
          schema: {type: string, enum: [today]}
          description: >-
            Opcional. `today` devuelve solo los planes activos de la sede y añade a cada uno el objeto
            `today` (período en curso según la frecuencia y la zona horaria de la sede, si ya se hizo,
            si está vencido y el turno evaluado en PER_SHIFT). Cualquier otro valor, vacío o repetido es
            400 INVALID_PAGINATION. El cursor queda vinculado a la vista. Sin `view` la respuesta no cambia.
      description: >-
        Reautoriza usuario, empresa, membresía y sede activas. ADMIN/SUPER_ADMIN
        configuran y consultan; CHEF (sedes asignadas) y ADMIN (todas las sedes de su empresa) reciben insumos y registran consumos y descartes; CHEF/WORKER
        registran limpieza propia. WORKER solo consulta planes de sedes asignadas y sus ejecuciones.
        Los hechos confirmados son inmutables; Idempotency-Key y UUID conservan
        la identidad del reintento. No admite otros parámetros ni campos desconocidos.
        Con `view=today`, `done` considera la ejecución COMPLETED u OBSERVED de cualquier persona
        de la sede en el período; `doneByMe` y `last*` salen solo de las ejecuciones de quien consulta
        (nunca se exponen datos de otras personas) y `overdue` aplica a DAILY y PER_SHIFT con `dueTime`.
        PER_SHIFT evalúa el turno activo abierto de la sede (si no hay, el próximo; si ya cerraron
        todos, el que cerró más tarde); sin turnos activos `shift` es null y `done` false.
      responses:
        "200":
          description: Registro o página autorizada; sin campos internos ni hash.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    maxItems: 100
                    items:
                      oneOf:
                        - {$ref: "#/components/schemas/OperationPlan"}
                        - {$ref: "#/components/schemas/OperationPlanToday"}
                  pagination:
                    type: object
                    required: [nextPageToken]
                    properties:
                      nextPageToken: {type: string}
        default: {$ref: "#/components/responses/WorkspaceError"}
    post:
      tags: [Operación diaria]
      operationId: createOperationPlan
      summary: Registrar planes de limpieza
      security: [{FirebaseBearer: []}]
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OperationPlanInput"}
      description: >-
