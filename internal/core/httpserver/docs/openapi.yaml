openapi: 3.0.3
info:
  title: BPM API
  version: 1.0.0
  description: >-
    API del sistema BPM para gestión de buenas prácticas, identidad y
    operaciones de organizaciones y locales.
servers:
  - url: /
    description: Servidor actual
tags:
  - name: Sistema
    description: Estado y disponibilidad del servicio.
  - name: Identidad
    description: Sesión e identidad verificadas con Firebase.
  - name: Organizaciones
    description: Espacio de trabajo, sedes y equipo con permisos por organización.
  - name: Checklists
    description: Plantillas publicadas y ejecuciones sincronizables por sede.
  - name: Incidencias
    description: Criterios versionados, atención, evidencia privada y verificación por sede.
  - name: Multimedia
    description: Fotos privadas por pregunta o incidencia, autorizadas por organización y sede.
  - name: Operación diaria
    description: Recepción, lotes PEPS y limpieza por sede autorizada.
  - name: Alertas
    description: Reglas configurables y bandeja privada con lectura y atención monotónicas.
  - name: Notificaciones
    description: Dispositivos propios; entrega externa desacoplada mediante outbox transaccional.
paths:
  /health:
    get:
      tags: [Sistema]
      summary: Verificar que el proceso está vivo
      operationId: getHealth
      responses:
        "200":
          description: Proceso en ejecución.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      tags: [Sistema]
      summary: Verificar disponibilidad de PostgreSQL
      operationId: getReadiness
      responses:
        "200":
          description: API y PostgreSQL disponibles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/:
    get:
      tags: [Sistema]
      summary: Consultar información básica de la API
      operationId: getAPIInfo
      responses:
        "200":
          description: Nombre y versión desplegada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIInfoResponse"
  /api/v1/auth/activity:
    post:
      tags: [Identidad]
      summary: Registrar actividad explícita de una sesión vigente
      description: >-
        No recibe cuerpo. Comprueba 8 horas desde auth_time y 15 minutos sin
        actividad; una sesión vencida exige autenticación nueva. No llamar
        periódicamente sin interacción del usuario.
      operationId: recordSessionActivity
      security:
        - FirebaseBearer: []
      responses:
        "200":
          description: Sesión técnica vigente; no concede permisos de empresa.
          headers:
            X-BPM-Session-Expires-At:
              description: Límite absoluto en segundos Unix.
              schema: { type: integer, format: int64 }
            X-BPM-Session-Idle-Expires-At:
              description: Límite de inactividad en segundos Unix.
              schema: { type: integer, format: int64 }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status: { type: string, enum: [ACTIVE] }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/auth/logout:
    post:
      tags: [Identidad]
      summary: Revocar el contexto autenticado actual
      description: >-
        No recibe cuerpo. Impide reabrir el mismo UID/auth_time mediante refresh.
        No revoca todas las otras autenticaciones de la cuenta.
      operationId: endCurrentSession
      security:
        - FirebaseBearer: []
      responses:
        "200":
          description: Contexto revocado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status: { type: string, enum: [SIGNED_OUT] }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/me:
    get:
      tags: [Identidad]
      summary: Obtener el perfil del usuario autenticado
      description: >-
        Valida el ID token de Firebase y devuelve el usuario, sus membresías,
        roles y locales activos registrados en PostgreSQL. Comprueba límites de
        sesión sin prolongar actividad; devuelve las dos cabeceras X-BPM-Session.
      operationId: getCurrentProfile
      security:
        - FirebaseBearer: []
      responses:
        "200":
          description: Perfil y membresías activas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Usuario no registrado, inactivo o correo sin verificar (EMAIL_NOT_VERIFIED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/auth/register:
    post:
      tags: [Identidad]
      summary: Completar el registro del perfil BPM
      description: >-
        Requiere un ID token Firebase con email verificado. El UID y correo salen
        del token. Crea USER/ACTIVE sin organizaciones; repetir no modifica
        roles, estado ni datos existentes. No acepta contraseñas ni permisos.
      operationId: registerProfile
      security:
        - FirebaseBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [displayName]
              properties:
                displayName:
                  type: string
                  minLength: 2
                  maxLength: 100
                  description: Nombre personal con letras Unicode, diacríticos, espacios, apóstrofos o guiones; sin números ni controles.
      responses:
        "200":
          description: Perfil registrado o perfil existente sin modificaciones.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileEnvelope"
        "400":
          description: JSON inválido, campos desconocidos o cuerpo demasiado grande.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: EMAIL_NOT_VERIFIED o USER_INACTIVE.
        "409":
          description: REGISTRATION_CONFLICT; nunca fusiona cuentas por email.
        "415":
          description: Se requiere application/json.
        "422":
          description: VALIDATION_ERROR con fields.displayName.
        "429":
          description: Demasiados intentos de registro.
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/organizations:
    get:
      parameters:
        - {$ref: "#/components/parameters/PageSize"}
        - {$ref: "#/components/parameters/PageToken"}
        - {$ref: "#/components/parameters/SearchQuery"}
      tags: [Organizaciones]
      summary: Listar organizaciones activas autorizadas por páginas
      operationId: listOrganizations
      security: [{FirebaseBearer: []}]
      responses:
        "200":
          description: Solo membresías activas; SUPER_ADMIN puede consultar todas. Sin query conserva 100 registros por compatibilidad; con parámetros usa 25 salvo pageSize explícito.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    maxItems: 100
                    items: {$ref: "#/components/schemas/WorkspaceOrganization"}
                  pagination: {$ref: "#/components/schemas/Pagination"}
        default: {$ref: "#/components/responses/WorkspaceError"}
    post:
      tags: [Organizaciones]
      summary: Crear organización (solo SUPER_ADMIN)
      operationId: createOrganization
      description: UUID generado por cliente; repetir el mismo ID y contenido no duplica. Otro contenido devuelve 409. Auditoría transaccional.
      security: [{FirebaseBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WorkspaceOrganization"}
      responses:
        "200":
          description: Creación o repetición idéntica confirmada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: "#/components/schemas/WorkspaceOrganization"}
        default: {$ref: "#/components/responses/WorkspaceError"}
  /api/v1/organizations/{organizationID}/workspace:
    parameters:
      - {$ref: "#/components/parameters/OrganizationID"}
    get:
      parameters:
        - {$ref: "#/components/parameters/PageSize"}
      tags: [Organizaciones]
      summary: Consultar espacio de trabajo autorizado
      operationId: getWorkspace
      description: Primera página de cada lista autorizada y cursores independientes. Admite solo pageSize; 25 por defecto con query y 100 sin query por compatibilidad. Totals cuenta todas las sedes permitidas, cursos publicados y controles publicados. WORKER ve solo sus incidencias.
      security: [{FirebaseBearer: []}]
      responses:
        "200":
          description: Organización, rol y listas autorizadas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: "#/components/schemas/Workspace"}
        default: {$ref: "#/components/responses/WorkspaceError"}
  /api/v1/organizations/{organizationID}/locations:
    parameters:
      - {$ref: "#/components/parameters/OrganizationID"}
    get:
      parameters:
        - {$ref: "#/components/parameters/PageSize"}
        - {$ref: "#/components/parameters/PageToken"}
        - {$ref: "#/components/parameters/SearchQuery"}
      tags: [Organizaciones]
      summary: Listar sedes autorizadas
      operationId: listLocations
      description: Miembro activo; CHEF y WORKER solo sedes asignadas. Búsqueda por nombre, dirección o distrito.
      security: [{FirebaseBearer: []}]
      responses:
        "200":
          description: Página autorizada. Cursor vacío significa fin; no se devuelve un total de páginas.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    maxItems: 100
                    items: {$ref: "#/components/schemas/WorkspaceLocation"}
                  pagination: {$ref: "#/components/schemas/Pagination"}
        "400": {$ref: "#/components/responses/InvalidPagination"}
        default: {$ref: "#/components/responses/WorkspaceError"}
    post:
      tags: [Organizaciones]
      summary: Crear sede (ADMIN del tenant o SUPER_ADMIN)
      operationId: createLocation
      description: UUID estable entre reintentos idénticos. Zona horaria America/Lima. No acepta actor ni organización en el cuerpo.
      security: [{FirebaseBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WorkspaceLocation"}
      responses:
        "200":
          description: Sede creada o repetición idéntica.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: "#/components/schemas/WorkspaceLocation"}
        default: {$ref: "#/components/responses/WorkspaceError"}
  /api/v1/organizations/{organizationID}/members/check:
    parameters:
      - {$ref: "#/components/parameters/OrganizationID"}
    post:
      tags: [Organizaciones]
      summary: Comprobar si una cuenta BPM puede agregarse al equipo
      operationId: checkMemberEligibility
      description: Solo ADMIN de la organización o SUPER_ADMIN, con sesión y correo verificados. Consulta exacta sin mutaciones. No lista usuarios ni revela perfiles o membresías de otras empresas. El correo viaja en JSON, sin parámetros de URL. El alta vuelve a autorizar y validar al confirmar; READY no reserva ni concede acceso.
      security: [{FirebaseBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: {type: string, format: email, maxLength: 320}
      responses:
        "200":
          description: Estado de cuenta disponible, ya incorporada en esta organización o no disponible. No disponible agrupa cuentas inexistentes e inactivas; un perfil BPM se crea tras verificar el correo en identidad.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status: {type: string, enum: [READY, ALREADY_MEMBER, UNAVAILABLE]}
        default: {$ref: "#/components/responses/WorkspaceError"}
  /api/v1/organizations/{organizationID}/members/search:
    parameters:
      - {$ref: "#/components/parameters/OrganizationID"}
    post:
      tags: [Organizaciones]
      summary: Sugerir cuentas incorporables mientras se escribe el correo
      operationId: searchMemberAccounts
      description: Solo ADMIN del tenant o SUPER_ADMIN con sesión verificada. Búsqueda dirigida por prefijo literal de correo, mínimo 3 caracteres. Devuelve hasta 5 correos de perfiles BPM activos, excluyendo membresías ya existentes de esta organización. No devuelve nombres, UID, roles ni membresías de otras organizaciones. Para un correo completo añade el estado exacto; una búsqueda parcial sin resultados no afirma inexistencia. Sin escrituras. El alta revalida permisos y pertenencia al confirmar. El cuerpo no se registra ni viaja en la URL; aplica el límite HTTP de solicitudes existente.
      security: [{FirebaseBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query]
              properties:
                query: {type: string, minLength: 3, maxLength: 320}
      responses:
        "200":
          description: Hasta cinco sugerencias, ordenadas por correo, y estado exacto opcional. Las cuentas inexistentes e inactivas comparten UNAVAILABLE.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [suggestions, exactStatus]
                    properties:
                      suggestions:
                        type: array
                        maxItems: 5
                        uniqueItems: true
                        items: {type: string, format: email, maxLength: 320}
                      exactStatus: {type: string, nullable: true, enum: [READY, ALREADY_MEMBER, UNAVAILABLE, null]}
        default: {$ref: "#/components/responses/WorkspaceError"}
  /api/v1/organizations/{organizationID}/members:
    parameters:
      - {$ref: "#/components/parameters/OrganizationID"}
    get:
      parameters:
        - {$ref: "#/components/parameters/PageSize"}
        - {$ref: "#/components/parameters/PageToken"}
        - {$ref: "#/components/parameters/SearchQuery"}
      tags: [Organizaciones]
      summary: Listar personas del equipo
      operationId: listMembers
      description: Solo ADMIN del tenant o SUPER_ADMIN. Búsqueda por nombre o correo.
      security: [{FirebaseBearer: []}]
      responses:
        "200":
          description: Página autorizada. Cursor vacío significa fin; no se devuelve un total de páginas.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    maxItems: 100
                    items: {$ref: "#/components/schemas/WorkspaceMember"}
                  pagination: {$ref: "#/components/schemas/Pagination"}
        "400": {$ref: "#/components/responses/InvalidPagination"}
        default: {$ref: "#/components/responses/WorkspaceError"}
    post:
      tags: [Organizaciones]
      summary: Agregar una cuenta BPM activa al equipo
      operationId: addOrganizationMember
      description: Solo ADMIN del tenant o SUPER_ADMIN. No envía invitaciones. No cambia membresías existentes. CHEF/WORKER requieren sedes del mismo tenant. No concede roles de plataforma.
      security: [{FirebaseBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, role]
              properties:
                email: {type: string, format: email, maxLength: 320}
                role: {type: string, enum: [ADMIN, CHEF, WORKER]}
                locationIds:
                  type: array
                  maxItems: 100
                  items: {type: string, format: uuid}
      responses:
        "200":
          description: Membresía creada con auditoría.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: {type: string, enum: [ACTIVE]}
        default: {$ref: "#/components/responses/WorkspaceError"}
  /api/v1/organizations/{organizationID}/checklists:
    parameters:
      - {$ref: "#/components/parameters/OrganizationID"}
    get:
      parameters:
        - {$ref: "#/components/parameters/PageSize"}
        - {$ref: "#/components/parameters/PageToken"}
        - {$ref: "#/components/parameters/SearchQuery"}
      tags: [Checklists]
      summary: Descargar catálogo de plantillas publicadas
      operationId: listChecklists
      description: Requiere membresía activa en cada página. Selecciona plantillas completas antes de sus preguntas; nunca divide una plantilla entre páginas. Sin query conserva 100 por compatibilidad. Búsqueda por nombre, área o descripción.
      security: [{FirebaseBearer: []}]
      responses:
        "200":
          description: Catálogo del tenant.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/ChecklistTemplate"}
                  pagination: {$ref: "#/components/schemas/Pagination"}
        default: {$ref: "#/components/responses/WorkspaceError"}
    post:
      tags: [Checklists]
      summary: Crear y publicar la primera versión de una plantilla
      operationId: createChecklist
      description: Solo ADMIN o SUPER_ADMIN. UUID de plantilla, versión e ítems generados por cliente. La versión publicada no se edita. Evidencia obligatoria todavía no se acepta.
      security: [{FirebaseBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChecklistTemplate"}
      responses:
        "201":
          description: Plantilla y versión publicadas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: "#/components/schemas/ChecklistTemplate"}
        default: {$ref: "#/components/responses/WorkspaceError"}
  /api/v1/organizations/{organizationID}/courses:
    parameters:
      - {$ref: "#/components/parameters/OrganizationID"}
    get:
      parameters:
        - {$ref: "#/components/parameters/PageSize"}
        - {$ref: "#/components/parameters/PageToken"}
        - {$ref: "#/components/parameters/SearchQuery"}
      tags: [Organizaciones]
      summary: Listar cursos publicados
      operationId: listCourses
      description: Miembro activo. Incluye progreso del solicitante. Búsqueda por título o descripción.
      security: [{FirebaseBearer: []}]
      responses:
        "200":
          description: Página autorizada. Cursor vacío significa fin; no se devuelve un total de páginas.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    maxItems: 100
                    items: {$ref: "#/components/schemas/WorkspaceEntry"}
                  pagination: {$ref: "#/components/schemas/Pagination"}
        "400": {$ref: "#/components/responses/InvalidPagination"}
        default: {$ref: "#/components/responses/WorkspaceError"}
  /api/v1/organizations/{organizationID}/checklist-summaries:
    parameters:
      - {$ref: "#/components/parameters/OrganizationID"}
    get:
      parameters:
        - {$ref: "#/components/parameters/PageSize"}
        - {$ref: "#/components/parameters/PageToken"}
        - {$ref: "#/components/parameters/SearchQuery"}
      tags: [Organizaciones]
      summary: Listar resúmenes de plantillas activas
      operationId: listChecklistSummaries
      description: Miembro activo. Este resumen no sustituye el catálogo publicado con preguntas.
      security: [{FirebaseBearer: []}]
      responses:
        "200":
          description: Página autorizada. Cursor vacío significa fin; no se devuelve un total de páginas.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    maxItems: 100
                    items: {$ref: "#/components/schemas/WorkspaceEntry"}
                  pagination: {$ref: "#/components/schemas/Pagination"}
        "400": {$ref: "#/components/responses/InvalidPagination"}
        default: {$ref: "#/components/responses/WorkspaceError"}
  /api/v1/organizations/{organizationID}/incident-catalog:
    parameters:
    - "$ref": "#/components/parameters/OrganizationID"
    get:
      tags:
      - Incidencias
      operationId: listIncidentCatalog
      summary: Listar últimas versiones del catálogo
      description: Todos los roles con membresía activa. Última versión por código; página
        de 25 por defecto y máximo 100. No contiene normativa de ejemplo.
      security:
      - FirebaseBearer: []
      parameters:
      - "$ref": "#/components/parameters/PageSize"
      - "$ref": "#/components/parameters/PageToken"
      - "$ref": "#/components/parameters/SearchQuery"
      responses:
        '200':
          description: Página o registro público autorizado; sin hashes, cuerpos internos
            ni credenciales.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/IncidentCatalogPage"
        '400':
          "$ref": "#/components/responses/InvalidPagination"
        default:
          "$ref": "#/components/responses/IncidentError"
    post:
      tags:
      - Incidencias
      operationId: createIncidentCatalog
      summary: Crear criterio de empresa
      description: Solo ADMIN/SUPER_ADMIN. Crea versión 1 inmutable; evidenceRequired
        es boolean obligatorio.
      security:
      - FirebaseBearer: []
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/IncidentCatalogInput"
      responses:
        '200':
          description: Página o registro público autorizado; sin hashes, cuerpos internos
            ni credenciales.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/IncidentCatalogEnvelope"
        '400':
          "$ref": "#/components/responses/IncidentError"
        default:
          "$ref": "#/components/responses/IncidentError"
  /api/v1/organizations/{organizationID}/incident-catalog/{catalogID}/versions:
    parameters:
    - "$ref": "#/components/parameters/OrganizationID"
    - name: catalogID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      tags:
      - Incidencias
      operationId: versionIncidentCatalog
      summary: Crear nueva versión de un criterio
      description: Solo ADMIN/SUPER_ADMIN. Conserva código, incrementa versión desde expectedVersion
        y mantiene criterios referenciados por incidencias anteriores.
      security:
      - FirebaseBearer: []
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/IncidentCatalogVersionInput"
      responses:
        '200':
          description: Página o registro público autorizado; sin hashes, cuerpos internos
            ni credenciales.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/IncidentCatalogEnvelope"
        '400':
          "$ref": "#/components/responses/IncidentError"
        default:
          "$ref": "#/components/responses/IncidentError"
  /api/v1/organizations/{organizationID}/incidents:
    parameters:
    - "$ref": "#/components/parameters/OrganizationID"
    get:
      tags:
      - Incidencias
      operationId: listIncidents
      summary: Listar incidencias visibles por sede
      description: Reautoriza organización y sede activas. WORKER solo ve reportes propios
        o incidencias asignadas. Búsqueda literal por criterio/descripción; status opcional.
        Orden createdAt DESC, id; 25 por defecto, máximo 100. Cursor vinculado a usuario,
        tenant, sede, búsqueda y estado.
      security:
      - FirebaseBearer: []
      parameters:
      - "$ref": "#/components/parameters/PageSize"
      - "$ref": "#/components/parameters/PageToken"
      - "$ref": "#/components/parameters/SearchQuery"
      - in: query
        name: locationId
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: status
        schema:
          type: string
          enum:
          - OPEN
          - ASSIGNED
          - IN_PROGRESS
          - RESOLVED
          - CLOSED
          - VERIFIED
      responses:
        '200':
          description: Página o registro público autorizado; sin hashes, cuerpos internos
            ni credenciales.
