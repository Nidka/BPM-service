      tags: [Academia]
      operationId: createTrainingAssignment
      summary: Asignar un curso publicado a una persona, un rol o una sede
      description: |
        ADMIN y SUPER_ADMIN. Idempotente por id (200 en repetición idéntica; otro contenido 409 IDEMPOTENCY_CONFLICT).
        Curso, persona o sede de otra empresa responden 404; curso sin publicar 422 TRAINING_COURSE_NOT_PUBLISHED;
        duplicado activo 409 TRAINING_ASSIGNMENT_EXISTS. Garantiza la regla de alertas TRAINING_ASSIGNED de la empresa;
        el aviso llega en el siguiente ciclo del worker (solo roles CHEF y WORKER).
      security: [{FirebaseBearer: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/TrainingAssignmentRequest"}}}
      responses:
        "200": {description: Repetición idéntica., content: {application/json: {schema: {$ref: "#/components/schemas/TrainingAssignmentResponse"}}}}
        "201": {description: Asignación creada., content: {application/json: {schema: {$ref: "#/components/schemas/TrainingAssignmentResponse"}}}}
        default: {$ref: "#/components/responses/TrainingError"}
    get:
      tags: [Academia]
      operationId: listTrainingAssignments
      summary: Listar asignaciones de la empresa (más recientes primero)
      description: ADMIN y SUPER_ADMIN. Filtros status (ACTIVE|CANCELLED) y courseId. Paginación por cursor.
      security: [{FirebaseBearer: []}]
      parameters:
      - {in: query, name: status, schema: {type: string, enum: [ACTIVE, CANCELLED]}}
      - {in: query, name: courseId, schema: {type: string, format: uuid}}
      - $ref: "#/components/parameters/PageSize"
      - $ref: "#/components/parameters/PageToken"
      responses:
        "200": {description: Página de asignaciones., content: {application/json: {schema: {$ref: "#/components/schemas/TrainingAssignmentPage"}}}}
        default: {$ref: "#/components/responses/TrainingError"}
  /api/v1/organizations/{organizationID}/training/assignments/{assignmentID}/cancel:
    parameters:
    - $ref: "#/components/parameters/OrganizationID"
    - {in: path, name: assignmentID, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Academia]
      operationId: cancelTrainingAssignment
      summary: Cancelar una asignación (idempotente)
      description: ADMIN y SUPER_ADMIN. Sin cuerpo. Asignación de otra empresa o inexistente responde 404 TRAINING_ASSIGNMENT_NOT_FOUND.
      security: [{FirebaseBearer: []}]
      responses:
        "200": {description: Asignación cancelada., content: {application/json: {schema: {$ref: "#/components/schemas/TrainingAssignmentResponse"}}}}
        default: {$ref: "#/components/responses/TrainingError"}
  /api/v1/organizations/{organizationID}/training/me/assignments:
    parameters:
    - $ref: "#/components/parameters/OrganizationID"
    get:
      tags: [Academia]
      operationId: listMyTrainingAssignments
      summary: Mis capacitaciones asignadas con estado calculado por el servidor
      description: Roles ADMIN, CHEF y WORKER (membresía). Un elemento por curso (la asignación con fecha límite más próxima). Estado PENDING, IN_PROGRESS, COMPLETED u OVERDUE.
      security: [{FirebaseBearer: []}]
      parameters:
      - $ref: "#/components/parameters/PageSize"
      - $ref: "#/components/parameters/PageToken"
      responses:
        "200": {description: Página., content: {application/json: {schema: {$ref: "#/components/schemas/TrainingMyAssignmentPage"}}}}
        default: {$ref: "#/components/responses/TrainingError"}
  /api/v1/organizations/{organizationID}/training/me/achievements:
    parameters:
    - $ref: "#/components/parameters/OrganizationID"
    get:
      tags: [Academia]
      operationId: getMyTrainingAchievements
      summary: Mis logros, XP total y racha
      description: |
        Insignias activas de la empresa con awardedAt (null si aún no se logra) y el desglose de XP. Los criterios los evalúa solo el servidor.
        streak es la racha de aprendizaje: días calendario con algún intento calificado o lección completada, en la zona de la primera
        sede activa asignada (America/Lima si no tiene), ventana de 400 días. La racha vigente termina hoy o ayer; si no, vale 0. No
        modifica la evaluación de la insignia STREAK_3, que sigue contando días UTC con intentos.
      security: [{FirebaseBearer: []}]
      responses:
        "200": {description: Logros., content: {application/json: {schema: {$ref: "#/components/schemas/TrainingMyAchievementsResponse"}}}}
        default: {$ref: "#/components/responses/TrainingError"}
  /api/v1/organizations/{organizationID}/training/me/offline-catalog:
    parameters:
    - $ref: "#/components/parameters/OrganizationID"
    get:
      tags: [Academia]
      operationId: getTrainingOfflineCatalog
      summary: Paquete offline con los cursos asignados
      description: Lecciones, preguntas sin respuestas ni explicaciones y metadatos de video privado (sin URL). Cabecera ETag y soporte de If-None-Match (304). Los videos de YouTube llevan offlineAvailable false.
      security: [{FirebaseBearer: []}]
      responses:
        "200": {description: Paquete., headers: {ETag: {schema: {type: string}}}, content: {application/json: {schema: {$ref: "#/components/schemas/TrainingOfflineCatalogResponse"}}}}
        "304": {description: Sin cambios.}
        default: {$ref: "#/components/responses/TrainingError"}
  /api/v1/organizations/{organizationID}/training/achievements:
    parameters:
    - $ref: "#/components/parameters/OrganizationID"
    get:
      tags: [Academia]
      operationId: listTrainingAchievements
      summary: Catálogo de insignias de la empresa
      description: ADMIN y SUPER_ADMIN. El catálogo por defecto se materializa en la empresa la primera vez.
      security: [{FirebaseBearer: []}]
      responses:
        "200": {description: Catálogo., content: {application/json: {schema: {$ref: "#/components/schemas/TrainingAchievementList"}}}}
        default: {$ref: "#/components/responses/TrainingError"}
  /api/v1/organizations/{organizationID}/training/achievements/{achievementID}:
    parameters:
    - $ref: "#/components/parameters/OrganizationID"
    - {in: path, name: achievementID, required: true, schema: {type: string, format: uuid}}
    put:
      tags: [Academia]
      operationId: updateTrainingAchievement
      summary: Editar nombre, puntos, umbral y vigencia de una insignia
      security: [{FirebaseBearer: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/TrainingAchievementUpdate"}}}
      responses:
        "200": {description: Insignia., content: {application/json: {schema: {type: object, properties: {data: {type: object, properties: {achievement: {$ref: "#/components/schemas/TrainingAchievement"}}}}}}}}
        default: {$ref: "#/components/responses/TrainingError"}
  /api/v1/organizations/{organizationID}/training/paths:
    parameters:
    - $ref: "#/components/parameters/OrganizationID"
    post:
      tags: [Academia]
      operationId: createTrainingPath
      summary: Crear una ruta de aprendizaje (DRAFT)
      description: ADMIN y SUPER_ADMIN. Idempotente por id. Los cursos deben existir en la empresa (422 con fields si no).
      security: [{FirebaseBearer: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/TrainingPathRequest"}}}
      responses:
        "200": {description: Repetición idéntica., content: {application/json: {schema: {$ref: "#/components/schemas/TrainingPathResponse"}}}}
        "201": {description: Ruta creada., content: {application/json: {schema: {$ref: "#/components/schemas/TrainingPathResponse"}}}}
        default: {$ref: "#/components/responses/TrainingError"}
    get:
      tags: [Academia]
      operationId: listTrainingPaths
      summary: Listar rutas con mi avance
      description: Quien aprende solo ve PUBLISHED; ADMIN puede filtrar por status. Orden por título.
      security: [{FirebaseBearer: []}]
      parameters:
      - {in: query, name: status, schema: {type: string, enum: [DRAFT, PUBLISHED, ARCHIVED]}}
      - $ref: "#/components/parameters/PageSize"
      - $ref: "#/components/parameters/PageToken"
      responses:
        "200": {description: Página de rutas., content: {application/json: {schema: {$ref: "#/components/schemas/TrainingPathPage"}}}}
        default: {$ref: "#/components/responses/TrainingError"}
  /api/v1/organizations/{organizationID}/training/paths/{pathID}:
    parameters:
    - $ref: "#/components/parameters/OrganizationID"
    - {in: path, name: pathID, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Academia]
      operationId: getTrainingPath
      summary: Obtener una ruta con mi avance
      security: [{FirebaseBearer: []}]
      responses:
        "200": {description: Ruta., content: {application/json: {schema: {$ref: "#/components/schemas/TrainingPathResponse"}}}}
        default: {$ref: "#/components/responses/TrainingError"}
    put:
      tags: [Academia]
      operationId: updateTrainingPath
      summary: Editar una ruta con control de versión
      description: ADMIN y SUPER_ADMIN. rowVersion obsoleto 409 TRAINING_PATH_CONFLICT; ruta archivada 409 TRAINING_PATH_ARCHIVED.
      security: [{FirebaseBearer: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/TrainingPathRequest"}}}
      responses:
        "200": {description: Ruta actualizada., content: {application/json: {schema: {$ref: "#/components/schemas/TrainingPathResponse"}}}}
        default: {$ref: "#/components/responses/TrainingError"}
  /api/v1/organizations/{organizationID}/training/paths/{pathID}/publish:
    parameters:
    - $ref: "#/components/parameters/OrganizationID"
    - {in: path, name: pathID, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Academia]
      operationId: publishTrainingPath
      summary: Publicar una ruta (idempotente)
      description: Exige al menos un curso y todos publicados (422 TRAINING_DRAFT_INCOMPLETE con fields).
      security: [{FirebaseBearer: []}]
      responses:
        "200": {description: Ruta publicada., content: {application/json: {schema: {$ref: "#/components/schemas/TrainingPathResponse"}}}}
        default: {$ref: "#/components/responses/TrainingError"}
  /api/v1/organizations/{organizationID}/training/paths/{pathID}/archive:
    parameters:
    - $ref: "#/components/parameters/OrganizationID"
    - {in: path, name: pathID, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Academia]
      operationId: archiveTrainingPath
      summary: Archivar una ruta (idempotente)
      security: [{FirebaseBearer: []}]
      responses:
        "200": {description: Ruta archivada., content: {application/json: {schema: {$ref: "#/components/schemas/TrainingPathResponse"}}}}
        default: {$ref: "#/components/responses/TrainingError"}
  /api/v1/public/training-certificates/{verificationCode}:
    get:
      tags: [Academia]
      operationId: verifyTrainingCertificate
      summary: Verificación pública de una constancia (sin autenticación)
      description: Limitada por IP (1 solicitud por segundo, ráfaga de 10). Solo datos mínimos. Código inexistente o con formato inválido 404 TRAINING_CERTIFICATE_NOT_FOUND; una constancia revocada responde 200 con status REVOKED. Cache-Control no-store.
      security: []
      parameters:
      - {in: path, name: verificationCode, required: true, schema: {type: string, pattern: "^[A-Z2-7]{24}$"}}
      responses:
        "200": {description: Constancia., content: {application/json: {schema: {$ref: "#/components/schemas/TrainingPublicCertificateResponse"}}}}
        "404": {description: No existe.}
        "429": {description: RATE_LIMITED.}
  /api/v1/organizations/{organizationID}/reports/compliance:
    parameters:
    - $ref: "#/components/parameters/OrganizationID"
    - {in: query, name: from, required: true, schema: {type: string, format: date}}
    - {in: query, name: to, required: true, description: "Máximo 92 días desde from, inclusive.", schema: {type: string, format: date}}
    - {in: query, name: locationId, schema: {type: string, format: uuid}}
    get:
      tags: [Reportes]
      operationId: getComplianceReport
      summary: Cumplimiento BPM por día, sede y empresa (RF-16)
      description: ADMIN, CHEF (solo sus sedes) y SUPER_ADMIN. WORKER recibe 403. El día es la fecha local de la sede (America/Lima por defecto). Detalle en specs/REPORTS.md.
      security: [{FirebaseBearer: []}]
      responses:
        "200":
          description: Cumplimiento por día, sede y empresa.
          content: {application/json: {schema: {$ref: "#/components/schemas/ComplianceReportResponse"}}}
        default: {$ref: "#/components/responses/ReportsError"}
  /api/v1/organizations/{organizationID}/reports/compliance/export.csv:
    parameters:
    - $ref: "#/components/parameters/OrganizationID"
    - {in: query, name: from, required: true, schema: {type: string, format: date}}
    - {in: query, name: to, required: true, description: "Máximo 366 días.", schema: {type: string, format: date}}
    - {in: query, name: locationId, schema: {type: string, format: uuid}}
    get:
      tags: [Reportes]
      operationId: exportChecklistHistoryCsv
      summary: Exportar el historial de checklists en CSV (RF-17)
      description: ADMIN, CHEF (solo sus sedes) y SUPER_ADMIN. Streaming UTF-8 sin datos de personas; los textos que inician con =, +, -, @, tabulador o retorno de carro se prefijan con comilla simple. Máximo 50000 filas (422 EXPORT_TOO_LARGE).
      security: [{FirebaseBearer: []}]
      responses:
        "200":
          description: Archivo CSV adjunto (Cache-Control no-store).
          content: {text/csv: {schema: {type: string}}}
        default: {$ref: "#/components/responses/ReportsError"}
  /api/v1/organizations/{organizationID}/reports/summary:
    parameters:
    - $ref: "#/components/parameters/OrganizationID"
    - {in: query, name: from, required: true, schema: {type: string, format: date}}
    - {in: query, name: to, required: true, description: "Máximo 366 días.", schema: {type: string, format: date}}
    - {in: query, name: locationId, schema: {type: string, format: uuid}}
    get:
      tags: [Reportes]
      operationId: getCompanyComplianceSummary
      summary: Reporte de cumplimiento por empresa y período (RF-28)
      description: Resumen por sede, área y plantilla, incidencias reportadas/cerradas/abiertas y temperaturas fuera de rango. ADMIN, CHEF (sus sedes) y SUPER_ADMIN.
      security: [{FirebaseBearer: []}]
      responses:
        "200":
          description: Resumen del período.
          content: {application/json: {schema: {$ref: "#/components/schemas/ComplianceSummaryResponse"}}}
        default: {$ref: "#/components/responses/ReportsError"}
  /api/v1/organizations/{organizationID}/reports/kpis:
    parameters:
    - $ref: "#/components/parameters/OrganizationID"
    get:
      tags: [Reportes]
      operationId: getKpis
      summary: Panel de indicadores clave (RF-30)
      description: Cumplimiento hoy/7/30 días, controles pendientes del día, alertas e incidencias abiertas y avance de capacitación (null para CHEF).
      security: [{FirebaseBearer: []}]
      responses:
        "200":
          description: Indicadores.
          content: {application/json: {schema: {$ref: "#/components/schemas/KpisResponse"}}}
        default: {$ref: "#/components/responses/ReportsError"}
  /api/v1/organizations/{organizationID}/reports/training/courses:
    parameters:
    - $ref: "#/components/parameters/OrganizationID"
    get:
      tags: [Reportes]
      operationId: getTrainingProgressByCourse
      summary: Avance de capacitación por curso (RF-09)
      description: Solo ADMIN y SUPER_ADMIN.
      security: [{FirebaseBearer: []}]
      responses:
        "200":
          description: Avance por curso publicado.
          content: {application/json: {schema: {$ref: "#/components/schemas/TrainingCourseProgressResponse"}}}
        default: {$ref: "#/components/responses/ReportsError"}
  /api/v1/organizations/{organizationID}/reports/training/people:
    parameters:
    - $ref: "#/components/parameters/OrganizationID"
    - {in: query, name: courseId, schema: {type: string, format: uuid}}
    - $ref: "#/components/parameters/PageSize"
    - $ref: "#/components/parameters/PageToken"
    get:
      tags: [Reportes]
      operationId: getTrainingProgressByPerson
      summary: Avance de capacitación por persona, paginado (RF-09)
      description: Solo ADMIN y SUPER_ADMIN. Ordenado por userId.
      security: [{FirebaseBearer: []}]
      responses:
        "200":
          description: Página de personas.
          content: {application/json: {schema: {$ref: "#/components/schemas/TrainingPeoplePage"}}}
        default: {$ref: "#/components/responses/ReportsError"}
  /api/v1/organizations/{organizationID}/reports/settings:
    parameters:
    - $ref: "#/components/parameters/OrganizationID"
    get:
      tags: [Reportes]
      operationId: getReportSettings
      summary: Configuración de reportes
      description: ADMIN y SUPER_ADMIN. Sin configuración previa devuelve correo semanal activo y umbral 80.
      security: [{FirebaseBearer: []}]
      responses:
        "200":
          description: Configuración vigente.
          content: {application/json: {schema: {$ref: "#/components/schemas/ReportSettingsResponse"}}}
        default: {$ref: "#/components/responses/ReportsError"}
    put:
      tags: [Reportes]
      operationId: putReportSettings
      summary: Actualizar la configuración de reportes
      description: Activa o desactiva el correo semanal (RF-29) y fija el umbral de las constancias (RF-39).
      security: [{FirebaseBearer: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ReportSettings"}}}
      responses:
        "200":
          description: Configuración guardada.
          content: {application/json: {schema: {$ref: "#/components/schemas/ReportSettingsResponse"}}}
        default: {$ref: "#/components/responses/ReportsError"}
  /api/v1/organizations/{organizationID}/reports/certificates:
    parameters:
    - $ref: "#/components/parameters/OrganizationID"
    get:
      tags: [Reportes]
      operationId: listComplianceCertificates
      summary: Constancias de cumplimiento emitidas
      description: ADMIN y SUPER_ADMIN. Más recientes primero.
      security: [{FirebaseBearer: []}]
      parameters:
      - $ref: "#/components/parameters/PageSize"
      - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: Página de constancias.
          content: {application/json: {schema: {$ref: "#/components/schemas/ComplianceCertificatePage"}}}
        default: {$ref: "#/components/responses/ReportsError"}
    post:
      tags: [Reportes]
      operationId: issueComplianceCertificate
      summary: Emitir la constancia de cumplimiento de un período (RF-39)
      description: ADMIN y SUPER_ADMIN. El servidor calcula el promedio de toda la empresa y emite solo si alcanza el umbral. Idempotente por período; el período debe haber terminado.
      security: [{FirebaseBearer: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ComplianceCertificateRequest"}}}
      responses:
        "200":
          description: Constancia ya emitida para ese período.
          content: {application/json: {schema: {$ref: "#/components/schemas/ComplianceCertificateResponse"}}}
        "201":
          description: Constancia emitida.
          content: {application/json: {schema: {$ref: "#/components/schemas/ComplianceCertificateResponse"}}}
        default: {$ref: "#/components/responses/ReportsError"}
  /api/v1/compliance-certificates/{code}:
    parameters:
    - {in: path, name: code, required: true, schema: {type: string, pattern: '^[A-Z2-7]{24}$'}}
    get:
      tags: [Reportes]
      operationId: verifyComplianceCertificate
      summary: Verificar una constancia por código (público)
      description: Sin autenticación. Devuelve solo datos agregados; código desconocido o mal formado responde 404 CERTIFICATE_NOT_FOUND.
      security: []
      responses:
        "200":
          description: Constancia válida.
          content: {application/json: {schema: {$ref: "#/components/schemas/PublicComplianceCertificateResponse"}}}
        default: {$ref: "#/components/responses/ReportsError"}
  /api/v1/organizations/{organizationID}/usage/events:
    parameters:
    - $ref: "#/components/parameters/OrganizationID"
    post:
      tags: [Uso]
      operationId: recordUsageEvents
      summary: Registrar un lote de eventos de uso (RF-27)
      description: ADMIN, CHEF y WORKER con membresía. Lote atómico de 1 a 50 eventos, idempotente por UUID de evento; usuario y empresa los fija el servidor; no se guardan cuerpos ni datos sanitarios.
      security: [{FirebaseBearer: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/UsageBatchRequest"}}}
      responses:
        "200":
          description: Eventos aceptados y duplicados.
          content: {application/json: {schema: {$ref: "#/components/schemas/UsageBatchResponse"}}}
        default: {$ref: "#/components/responses/ReportsError"}
  /api/v1/organizations/{organizationID}/usage/summary:
    parameters:
    - $ref: "#/components/parameters/OrganizationID"
    - {in: query, name: from, required: true, schema: {type: string, format: date}}
    - {in: query, name: to, required: true, description: "Máximo 92 días.", schema: {type: string, format: date}}
    - {in: query, name: scope, required: false, description: "operational (por defecto, todos los usuarios) o research (solo usuarios con participación ACTIVE y consentimiento de investigación vigente).", schema: {type: string, enum: [operational, research]}}
    get:
      tags: [Uso]
      operationId: getUsageSummary
      summary: Uso agregado de la aplicación
      description: ADMIN y SUPER_ADMIN. Sesiones, duración y módulos, sin datos de personas.
      security: [{FirebaseBearer: []}]
      responses:
        "200":
          description: Resumen de uso.
          content: {application/json: {schema: {$ref: "#/components/schemas/UsageSummaryResponse"}}}
        default: {$ref: "#/components/responses/ReportsError"}
  /api/v1/organizations/{organizationID}/shifts:
    parameters:
      - {$ref: "#/components/parameters/OrganizationID"}
    get:
      tags: [Operación diaria]
      operationId: listShifts
      summary: Listar turnos de una sede
      security: [{FirebaseBearer: []}]
      parameters:
        - {$ref: "#/components/parameters/PageSize"}
        - {$ref: "#/components/parameters/PageToken"}
        - {$ref: "#/components/parameters/SearchQuery"}
        - {in: query, name: locationId, required: true, schema: {type: string, format: uuid}}
        - {in: query, name: status, required: false, schema: {type: string, enum: [ACTIVE, ALL], default: ACTIVE}, description: "ALL solo para ADMIN/SUPER_ADMIN."}
      description: Roles ADMIN, SUPER_ADMIN, CHEF y WORKER con acceso a la sede. Orden por hora de inicio.
      responses:
        "200":
          description: Página de turnos.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data: {type: array, maxItems: 100, items: {$ref: "#/components/schemas/Shift"}}
                  pagination: {type: object, required: [nextPageToken], properties: {nextPageToken: {type: string}}}
        default: {$ref: "#/components/responses/WorkspaceError"}
    post:
      tags: [Operación diaria]
      operationId: createShift
      summary: Definir un turno (ADMIN/SUPER_ADMIN)
      security: [{FirebaseBearer: []}]
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ShiftInput"}
      description: Horas locales de la sede. Un fin menor que el inicio cruza la medianoche. 422 si se solapa con otro turno activo o repite el nombre.
      responses:
        "200":
          description: Turno creado o recuperado.
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {$ref: "#/components/schemas/Shift"}}}
        default: {$ref: "#/components/responses/WorkspaceError"}
  /api/v1/organizations/{organizationID}/shifts/{shiftID}:
    parameters:
      - {$ref: "#/components/parameters/OrganizationID"}
      - {in: path, name: shiftID, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Operación diaria]
      operationId: getShift
      summary: Consultar un turno
      security: [{FirebaseBearer: []}]
      responses:
        "200":
          description: Turno.
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {$ref: "#/components/schemas/Shift"}}}
        default: {$ref: "#/components/responses/WorkspaceError"}
    put:
      tags: [Operación diaria]
      operationId: updateShift
      summary: Cambiar nombre y horario con rowVersion
      security: [{FirebaseBearer: []}]
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, startTime, endTime, rowVersion]
              properties:
                name: {type: string, minLength: 2, maxLength: 60}
                startTime: {type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"}
                endTime: {type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"}
                rowVersion: {type: integer, minimum: 1}
      responses:
        "200":
          description: Turno actualizado. 409 si la versión es obsoleta o el turno está inactivo.
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {$ref: "#/components/schemas/Shift"}}}
        default: {$ref: "#/components/responses/WorkspaceError"}
  /api/v1/organizations/{organizationID}/shifts/{shiftID}/deactivate:
    parameters:
      - {$ref: "#/components/parameters/OrganizationID"}
      - {in: path, name: shiftID, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Operación diaria]
      operationId: deactivateShift
      summary: Desactivar un turno sin programaciones activas
      security: [{FirebaseBearer: []}]
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [rowVersion], properties: {rowVersion: {type: integer, minimum: 1}}}
      responses:
        "200":
          description: Turno inactivo (repetible). 409 SHIFT_IN_USE si hay programaciones activas.
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {$ref: "#/components/schemas/Shift"}}}
        default: {$ref: "#/components/responses/WorkspaceError"}
  /api/v1/organizations/{organizationID}/stock-movements:
    parameters:
      - {$ref: "#/components/parameters/OrganizationID"}
    get:
      tags: [Operación diaria]
      operationId: listStockMovements
      summary: Historial de consumos y descartes por sede, lote o tipo
      security: [{FirebaseBearer: []}]
      parameters:
        - {$ref: "#/components/parameters/PageSize"}
        - {$ref: "#/components/parameters/PageToken"}
        - {$ref: "#/components/parameters/SearchQuery"}
        - {in: query, name: locationId, required: true, schema: {type: string, format: uuid}}
        - {in: query, name: lotId, required: false, schema: {type: string, format: uuid}}
        - {in: query, name: type, required: false, schema: {type: string, enum: [CONSUMPTION, DISCARD]}}
      responses:
        "200":
          description: Página, del más reciente al más antiguo.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data: {type: array, maxItems: 100, items: {$ref: "#/components/schemas/StockMovement"}}
                  pagination: {type: object, required: [nextPageToken], properties: {nextPageToken: {type: string}}}
        default: {$ref: "#/components/responses/WorkspaceError"}
    post:
      tags: [Operación diaria]
      operationId: createStockMovement
      summary: Registrar consumo o descarte de un lote (CHEF de la sede)
      security: [{FirebaseBearer: []}]
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/StockMovementInput"}
      responses:
        "200":
          description: Movimiento registrado o recuperado. 409 INSUFFICIENT_STOCK o LOT_EXPIRED.
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {$ref: "#/components/schemas/StockMovement"}}}
        default: {$ref: "#/components/responses/WorkspaceError"}
  /api/v1/organizations/{organizationID}/stock-movements/{movementID}:
    parameters:
      - {$ref: "#/components/parameters/OrganizationID"}
      - {in: path, name: movementID, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Operación diaria]
      operationId: getStockMovement
      summary: Consultar un movimiento
      security: [{FirebaseBearer: []}]
      responses:
        "200":
          description: Movimiento.
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {$ref: "#/components/schemas/StockMovement"}}}
        default: {$ref: "#/components/responses/WorkspaceError"}
  /api/v1/organizations/{organizationID}/checklists/{templateID}/versions:
    parameters:
      - {$ref: "#/components/parameters/OrganizationID"}
      - {in: path, name: templateID, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Checklists]
      operationId: listChecklistVersions
      summary: Historial de versiones de una plantilla
      security: [{FirebaseBearer: []}]
      parameters:
        - {$ref: "#/components/parameters/PageSize"}
        - {$ref: "#/components/parameters/PageToken"}
      responses:
        "200":
          description: Versiones de la más reciente a la más antigua.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data: {type: array, items: {$ref: "#/components/schemas/ChecklistVersion"}}
                  pagination: {type: object, required: [nextPageToken], properties: {nextPageToken: {type: string}}}
        default: {$ref: "#/components/responses/WorkspaceError"}
    post:
      tags: [Checklists]
      operationId: publishChecklistVersion
      summary: Publicar una versión nueva e inmutable (ADMIN/SUPER_ADMIN)
      security: [{FirebaseBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [versionId, baseVersionNumber, items]
              properties:
                versionId: {type: string, format: uuid}
                baseVersionNumber: {type: integer, minimum: 1}
                changeNote: {type: string, maxLength: 500}
                items: {type: array, minItems: 1, maxItems: 100, items: {type: object}}
      responses:
        "201":
          description: Versión publicada (misma respuesta al repetir UUID y contenido). 409 VERSION_CONFLICT si otra versión se publicó antes.
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {type: object}}}
        default: {$ref: "#/components/responses/WorkspaceError"}
  /api/v1/organizations/{organizationID}/checklists/{templateID}/versions/{versionID}:
    parameters:
      - {$ref: "#/components/parameters/OrganizationID"}
      - {in: path, name: templateID, required: true, schema: {type: string, format: uuid}}
      - {in: path, name: versionID, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Checklists]
      operationId: getChecklistVersion
      summary: Versión concreta con sus preguntas
      security: [{FirebaseBearer: []}]
      responses:
        "200":
          description: Plantilla con las preguntas de esa versión.
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {type: object}}}
        default: {$ref: "#/components/responses/WorkspaceError"}
  /api/v1/organizations/{organizationID}/cleaning-executions/{executionID}/evidence:
    parameters:
      - {$ref: "#/components/parameters/OrganizationID"}
      - {in: path, name: executionID, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Evidencias]
      operationId: listCleaningEvidence
      summary: Fotos de una ejecución de limpieza
      security: [{FirebaseBearer: []}]
      description: Reserva con POST /media/uploads enviando cleaningExecutionId; confirmar, descargar y retirar usan las rutas de /media/{mediaID}.
      responses:
        "200":
          description: Fotos activas, política de carga y disponibilidad.
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {type: object}}}
        default: {$ref: "#/components/responses/MediaError"}
components:
  parameters:
    PageSize:
      in: query
      name: pageSize
      description: Tamaño de página. Nuevos endpoints usan 25; endpoints existentes sin query conservan 100.
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
    PageToken:
      in: query
      name: pageToken
      description: Cursor de continuación devuelto por el servidor. Reutilizar con el mismo usuario, tenant, recurso y búsqueda; no concede permisos. Cambiar pageSize está permitido.
      schema: {type: string, maxLength: 2048, pattern: '^[A-Za-z0-9_-]*$'}
    SearchQuery:
      in: query
      name: query
      description: Subcadena literal sin distinción de mayúsculas. Máximo 160 caracteres, sin controles; no admite comodines SQL.
      schema: {type: string, maxLength: 160}
    OrganizationID:
      in: path
      name: organizationID
      required: true
      description: Se autoriza contra membresía activa; enviar un ID no concede acceso.
      schema: {type: string, maxLength: 64}
    ChecklistAssignmentID:
      in: path
      name: assignmentID
      required: true
      schema: {type: string, format: uuid}
    ChecklistRunID:
      in: path
      name: runID
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: {type: string, minLength: 8, maxLength: 100}
  securitySchemes:
    FirebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
      description: ID token emitido por Firebase Authentication.
  responses:
    ReportsError:
      description: >-
        400 INVALID_REQUEST/INVALID_PAGINATION; 401 UNAUTHENTICATED/SESSION_EXPIRED; 403 ACCESS_DENIED;
        404 REPORT_LOCATION_NOT_FOUND, TRAINING_COURSE_NOT_FOUND o CERTIFICATE_NOT_FOUND; 409
        IDEMPOTENCY_CONFLICT o USAGE_SESSION_CONFLICT; 422 VALIDATION_ERROR, REPORT_NO_DATA,
        REPORT_THRESHOLD_NOT_MET o EXPORT_TOO_LARGE; 429 RATE_LIMITED; 500 INTERNAL_ERROR sanitizado.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    TrainingError:
      description: >-
        400 INVALID_REQUEST (JSON estricto, query o cuerpo no admitidos); 401 UNAUTHENTICATED/SESSION_EXPIRED;
        403 ACCESS_DENIED (rol insuficiente, sin membresía o SUPER_ADMIN sin membresía en operaciones que
        persisten progreso o intentos); 404 TRAINING_COURSE_NOT_FOUND, TRAINING_LESSON_NOT_FOUND,
        TRAINING_QUESTION_NOT_FOUND, TRAINING_VIDEO_NOT_FOUND o TRAINING_DRAFT_NOT_FOUND (también para
        recursos de otra organización); 409 TRAINING_DRAFT_CONFLICT, TRAINING_COURSE_CODE_TAKEN,
        TRAINING_VERSION_OUTDATED, IDEMPOTENCY_CONFLICT, TRAINING_VIDEO_CONFLICT, TRAINING_VIDEO_NOT_READY, TRAINING_ASSIGNMENT_EXISTS,
        TRAINING_PATH_CONFLICT o TRAINING_PATH_ARCHIVED; 404 adicionales TRAINING_ASSIGNEE_NOT_FOUND,
        TRAINING_LOCATION_NOT_FOUND, TRAINING_ASSIGNMENT_NOT_FOUND, TRAINING_ACHIEVEMENT_NOT_FOUND,
        TRAINING_PATH_NOT_FOUND y TRAINING_CERTIFICATE_NOT_FOUND; 422 TRAINING_COURSE_NOT_PUBLISHED;
        422 VALIDATION_ERROR, TRAINING_ANSWERS_INVALID, TRAINING_DRAFT_INCOMPLETE (con fields) o
        TRAINING_VIDEO_INVALID; 429 RATE_LIMITED; 500 INTERNAL_ERROR sanitizado; 503 STORAGE_UNAVAILABLE.
        Nunca expone URL firmadas, respuestas correctas ni detalles internos.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    AlertError:
      description: "400 INVALID_REQUEST/INVALID_PAGINATION; 401 UNAUTHENTICATED/SESSION_EXPIRED; 403 ACCESS_DENIED; 404 NOT_FOUND; 409 RESOURCE_CONFLICT; 415 JSON requerido; 422 VALIDATION_ERROR; 429 RATE_LIMITED; 500 INTERNAL_ERROR sanitizado; 503 dependencia no disponible. JSON UTF8 estricto máximo 512 KiB, respuesta del proxy máximo 4 MiB; nunca expone correos, tokens, cuerpos internos ni configuración del proveedor."
      headers: {"X-BPM-Session-Expires-At": {"description": "Límite absoluto de sesión en segundos Unix.", "schema": {"type": "integer", "format": "int64"}}, "X-BPM-Session-Idle-Expires-At": {"description": "Límite de inactividad en segundos Unix.", "schema": {"type": "integer", "format": "int64"}}}
      content: {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}
    IncidentError:
      description: 400 INVALID_REQUEST/INVALID_PAGINATION; 401 UNAUTHENTICATED/SESSION_EXPIRED;
        403 ACCESS_DENIED; 404 NOT_FOUND; 409 RESOURCE_CONFLICT; 415 JSON requerido; 422
        VALIDATION_ERROR con fields; 429 RATE_LIMITED; 500 INTERNAL_ERROR sanitizado; 503
        dependencia no disponible. Entradas JSON estrictas UTF8 hasta 512 KiB, proxy con
        respuesta máxima 4 MiB. Rechaza campos, métodos y filtros desconocidos.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    MediaError:
      description: >-
        400 INVALID_REQUEST; 401 UNAUTHENTICATED/SESSION_EXPIRED; 403 ACCESS_DENIED o correo sin verificar;
        404 NOT_FOUND; 409 RESOURCE_CONFLICT o UPLOAD_NOT_READY (aún no existe objeto);
        422 VALIDATION_ERROR, MEDIA_CONTENT_INVALID (FAILED) o MEDIA_LIMIT_REACHED;
        503 MEDIA_UNAVAILABLE; 500 INTERNAL_ERROR sanitizado.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    InvalidPagination:
      description: 400 INVALID_PAGINATION; cursor mal formado, contexto distinto o parámetros inválidos/repetidos/desconocidos. Reiniciar la lista con cursor vacío.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    WorkspaceError:
      description: 400 JSON inválido; 401 sesión inválida; 403 sin permiso/correo sin verificar; 404 cuenta no disponible; 409 conflicto; 415 no JSON; 422 fields inválidos; 429 límite; 500/503 fallo sanitizado.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    Unauthenticated:
      description: Token ausente, inválido, vencido o revocado; SESSION_EXPIRED si el contexto BPM venció o fue cerrado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Error interno sanitizado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Dependencia técnica o autenticación no disponible.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ResearchError:
      description: Error sanitizado del módulo de investigación (RESEARCH_ACCESS_DENIED, RESEARCH_CONSENT_REQUIRED, RESEARCH_VERSION_OUTDATED, RESEARCH_SUBMISSION_EXISTS, IDEMPOTENCY_CONFLICT, RESEARCH_INSTRUMENT_INCOMPLETE y otros).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    TrainingCourse:
      type: object
      required: [id, code, title, description, estimatedDurationMinutes]
      properties:
        id: {type: string, format: uuid}
        code: {type: string, maxLength: 50, example: M-01}
        title: {type: string, maxLength: 200}
        description: {type: string}
        estimatedDurationMinutes: {type: integer, nullable: true, minimum: 1}
        status: {type: string, enum: [DRAFT, PUBLISHED, ARCHIVED], description: "Solo en respuestas de autoría."}
    TrainingProgress:
      type: object
      required: [status, lastLessonId, bestScore, experiencePoints, completedAt]
      properties:
        status: {type: string, enum: [NOT_STARTED, IN_PROGRESS, COMPLETED]}
        lastLessonId: {type: string, format: uuid, nullable: true}
        bestScore: {type: integer, nullable: true, minimum: 0, maximum: 100, description: "Mejor puntaje de un intento FINAL."}
        experiencePoints: {type: integer, minimum: 0, description: "10 por cada respuesta correcta del mejor FINAL aprobado; calculado por el servidor."}
        completedAt: {type: string, format: date-time, nullable: true}
        completedLessonIds: {type: array, items: {type: string, format: uuid}, description: "Lecciones completadas de la versión publicada, en orden de temario; con status COMPLETED son todas. Vacío en el catálogo offline."}
        completedLessons: {type: integer, minimum: 0}
        totalLessons: {type: integer, minimum: 0, description: "Lecciones de la versión publicada."}
        percent: {type: integer, minimum: 0, maximum: 100, description: "100 si status=COMPLETED; si no, lecciones completadas / totales (redondeo .5 hacia arriba)."}
    TrainingCertificate:
      type: object
      nullable: true
      required: [id, verificationCode, issuedAt]
      properties:
        id: {type: string, format: uuid}
        verificationCode: {type: string, minLength: 16, description: "Código aleatorio criptográfico en base32."}
        issuedAt: {type: string, format: date-time}
    TrainingLearnVideo:
      type: object
      nullable: true
      required: [mediaId, mimeType, sizeBytes]
      properties:
        mediaId: {type: string, format: uuid}
        mimeType: {type: string, enum: [video/mp4, video/webm]}
        sizeBytes: {type: integer, format: int64}
    TrainingLearnLesson:
      type: object
      required: [id, title, content, displayOrder, video]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        content: {type: string, description: Texto plano con saltos de línea.}
        displayOrder: {type: integer, minimum: 1}
        video: {$ref: "#/components/schemas/TrainingLearnVideo"}
        externalVideo: {$ref: "#/components/schemas/TrainingExternalVideo"}
        keyPoints: {type: array, maxItems: 5, items: {type: string, minLength: 1, maxLength: 200}, description: "Lo esencial de la lección (hasta 5 puntos); siempre un arreglo, vacío si no hay."}
        captionsVtt: {type: string, maxLength: 100000, description: "Subtítulos WebVTT de la lección (RF-45); \"\" si no tiene."}
    TrainingLearnQuestion:
      type: object
      description: Nunca incluye correctOption ni explanation; la respuesta solo se revela tras responder.
      required: [id, lessonId, questionText, options, displayOrder]
      properties:
        id: {type: string, format: uuid}
        lessonId: {type: string, format: uuid, nullable: true}
        questionText: {type: string}
        options: {type: array, minItems: 2, maxItems: 6, items: {type: string, maxLength: 300}}
        displayOrder: {type: integer, minimum: 1}
    TrainingCourseView:
      type: object
      required: [course, version, lessons, questions, progress, certificate]
      properties:
        course: {$ref: "#/components/schemas/TrainingCourse"}
        version:
          type: object
          required: [id, versionNumber, passingScore]
          properties:
            id: {type: string, format: uuid}
            versionNumber: {type: integer}
            passingScore: {type: integer, minimum: 1, maximum: 100}
        lessons: {type: array, items: {$ref: "#/components/schemas/TrainingLearnLesson"}}
        questions: {type: array, items: {$ref: "#/components/schemas/TrainingLearnQuestion"}}
        progress: {$ref: "#/components/schemas/TrainingProgress"}
        certificate: {$ref: "#/components/schemas/TrainingCertificate"}
    TrainingCourseViewResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/TrainingCourseView"}
    TrainingVideoAccessResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [url, mimeType, expiresAt]
          properties:
            url: {type: string, format: uri, description: "GET firmado de R2 válido 15 minutos. Es una credencial: no se registra ni se persiste."}
            mimeType: {type: string, enum: [video/mp4, video/webm]}
            expiresAt: {type: string, format: date-time}
    TrainingProgressRequest:
      type: object
      additionalProperties: false
      required: [lastLessonId]
      properties:
        lastLessonId: {type: string, format: uuid}
        completedLessonId: {type: string, format: uuid, description: "Opcional: marca esa lección como completada (idempotente). Debe ser de la versión publicada (404 TRAINING_LESSON_NOT_FOUND)."}
    TrainingProgressResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [progress]
          properties:
            progress: {$ref: "#/components/schemas/TrainingProgress"}
    TrainingStudyRequest:
      type: object
      additionalProperties: false
      required: [questionId, selectedOption]
      properties:
        questionId: {type: string, format: uuid}
        selectedOption: {type: integer, minimum: 0, description: "Índice 0-based; fuera de rango responde 422."}
    TrainingStudyResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [correct, correctOption, explanation]
          properties:
            correct: {type: boolean}
            correctOption: {type: integer}
            explanation: {type: string}
    TrainingAttemptRequest:
      type: object
      additionalProperties: false
      description: El cliente nunca envía puntaje, aprobación ni XP; cualquier campo adicional se rechaza.
      required: [id, clientOperationId, versionId, attemptType, startedAt, clientCreatedAt, answers]
      properties:
        id: {type: string, format: uuid}
        clientOperationId: {type: string, format: uuid}
        versionId: {type: string, format: uuid}
        attemptType: {type: string, enum: [DIAGNOSTIC, FINAL, MODULE]}
        lessonId: {type: string, format: uuid, description: Obligatorio y solo para MODULE; solo se evalúan las preguntas de esa lección (lección ajena 404 TRAINING_LESSON_NOT_FOUND). MODULE no completa el curso ni emite constancia; da XP e insignias.}
        startedAt: {type: string, format: date-time}
        clientCreatedAt: {type: string, format: date-time}
        answers:
          type: array
          description: Exactamente una respuesta por cada pregunta de la versión.
          items:
            type: object
            additionalProperties: false
            required: [questionId, selectedOption]
            properties:
              questionId: {type: string, format: uuid}
              selectedOption: {type: integer, minimum: 0}
    TrainingAttemptResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [attempt, results, progress, certificate, achievements]
          properties:
            achievements: {type: array, items: {$ref: "#/components/schemas/TrainingAchievement"}, description: Insignias otorgadas por este intento (también en la repetición idéntica).}
            attempt:
              type: object
              required: [id, attemptType, score, passed, completedAt]
              properties:
                id: {type: string, format: uuid}
                attemptType: {type: string, enum: [DIAGNOSTIC, FINAL]}
                score: {type: integer, minimum: 0, maximum: 100, description: "round(correctas*100/total), calculado por el servidor."}
                passed: {type: boolean, description: "score >= passingScore de la versión."}
                completedAt: {type: string, format: date-time}
                xpEarned: {type: integer, minimum: 0, description: "XP del intento: curso + módulo + puntos de las insignias otorgadas. Idéntico en la repetición. Se omite en intentos anteriores a V15."}
            nextCourse:
              type: object
              nullable: true
              description: |
                Siguiente curso sugerido tras un FINAL aprobado; null en cualquier otro intento o si no hay uno. Primero la ruta
                PUBLISHED que contiene el curso y propone otro curso (la publicada más recientemente si hay varias); si ninguna, el
                primer curso PENDING u OVERDUE de las asignaciones de la persona (pathId y pathTitle son null).
              required: [pathId, pathTitle, courseId, courseTitle]
              properties:
                pathId: {type: string, format: uuid, nullable: true}
                pathTitle: {type: string, nullable: true}
                courseId: {type: string, format: uuid}
                courseTitle: {type: string}
            results:
              type: array
              items:
                type: object
                required: [questionId, selectedOption, correct, correctOption, explanation]
                properties:
                  questionId: {type: string, format: uuid}
                  selectedOption: {type: integer}
                  correct: {type: boolean}
                  correctOption: {type: integer}
                  explanation: {type: string}
            progress: {$ref: "#/components/schemas/TrainingProgress"}
            certificate: {$ref: "#/components/schemas/TrainingCertificate"}
    TrainingCourseRequest:
      type: object
      additionalProperties: false
      required: [code, title]
      properties:
        code: {type: string, maxLength: 50, description: "Letras, números, guiones y guiones bajos; se normaliza a mayúsculas.", example: M-01}
        title: {type: string, minLength: 2, maxLength: 200}
        description: {type: string, maxLength: 2000}
        estimatedDurationMinutes: {type: integer, minimum: 1, maximum: 1440}
    TrainingCourseCreatedResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [course]
          properties:
            course: {$ref: "#/components/schemas/TrainingCourse"}
    TrainingCourseListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              maxItems: 100
              items:
                type: object
                required: [id, code, title, status, publishedVersionNumber, hasDraft]
                properties:
                  id: {type: string, format: uuid}
                  code: {type: string}
                  title: {type: string}
                  status: {type: string, enum: [DRAFT, PUBLISHED, ARCHIVED]}
                  publishedVersionNumber: {type: integer, nullable: true}
                  hasDraft: {type: boolean}
    TrainingDraftLesson:
      type: object
      additionalProperties: false
      required: [id, title, content, displayOrder]
      properties:
        id: {type: string, format: uuid, description: Generado por el cliente.}
        title: {type: string, minLength: 1, maxLength: 200}
        content: {type: string, maxLength: 20000}
        displayOrder: {type: integer, minimum: 1}
        videoMediaId: {type: string, format: uuid, nullable: true, description: "Video de capacitación AVAILABLE o PENDING_UPLOAD de la organización."}
        externalVideo: {nullable: true, description: "Entrada: URL de YouTube (watch?v=, youtu.be, shorts, youtube-nocookie.com/embed) como texto u objeto {provider: YOUTUBE, videoId | url}; el servidor la normaliza a {provider, videoId}. Otro dominio o formato inválido 422; con videoMediaId a la vez 422. Salida: objeto TrainingExternalVideo o null."}
        keyPoints: {type: array, maxItems: 5, items: {type: string, minLength: 1, maxLength: 200}, description: "Entrada: ausente o null conserva los puntos previos de la lección (misma id); [] los borra; hasta 5 puntos de 1 a 200 caracteres en una línea, sin repetirse (422 en lessons[i].keyPoints). Salida: siempre un arreglo."}
        captionsVtt: {type: string, maxLength: 100000, description: "Subtítulos WebVTT de la lección (RF-45). Entrada: ausente o null conserva los previos; \"\" los borra."}
    TrainingDraftQuestion:
      type: object
      additionalProperties: false
      required: [id, questionText, options, correctOption, displayOrder]
      properties:
        id: {type: string, format: uuid, description: Generado por el cliente.}
        lessonId: {type: string, format: uuid, nullable: true, description: Debe existir en el mismo cuerpo.}
        questionText: {type: string, minLength: 1, maxLength: 1000}
        options: {type: array, minItems: 2, maxItems: 6, items: {type: string, minLength: 1, maxLength: 300}}
        correctOption: {type: integer, minimum: 0}
        explanation: {type: string, maxLength: 2000}
        displayOrder: {type: integer, minimum: 1}
    TrainingDraftRequest:
      type: object
      additionalProperties: false
      description: Reemplaza por completo lecciones y preguntas del borrador; ambas listas son obligatorias (pueden estar vacías).
      required: [version, lessons, questions]
      properties:
        version:
          type: object
          additionalProperties: false
          required: [passingScore, rowVersion]
          properties:
            id: {type: string, format: uuid}
            versionNumber: {type: integer}
            passingScore: {type: integer, minimum: 1, maximum: 100}
            rowVersion: {type: string, description: "Valor devuelto por la última lectura; también se acepta como número."}
        lessons: {type: array, maxItems: 50, items: {$ref: "#/components/schemas/TrainingDraftLesson"}}
        questions: {type: array, maxItems: 100, items: {$ref: "#/components/schemas/TrainingDraftQuestion"}}
    TrainingDraftResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [course, version, lessons, questions]
          properties:
            course: {$ref: "#/components/schemas/TrainingCourse"}
            version:
              type: object
              required: [id, versionNumber, passingScore, rowVersion]
              properties:
                id: {type: string, format: uuid}
                versionNumber: {type: integer}
                passingScore: {type: integer}
                rowVersion: {type: string}
