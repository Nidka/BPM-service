      security: [{FirebaseBearer: []}]
      parameters:
      - {in: query, name: pageSize, schema: {type: integer, minimum: 1, maximum: 100}}
      - {in: query, name: pageToken, schema: {type: string}}
      - {in: query, name: organizationId, schema: {type: string}}
      responses:
        "200":
          description: Correcto.
          content: {application/json: {schema: {$ref: "#/components/schemas/ResearchListResponse"}}}
        default: {$ref: "#/components/responses/ResearchError"}
    post:
      tags: [Investigación]
      operationId: addResearchNeed
      summary: Registrar necesidad detectada (RF-50)
      description: "Investigador. Categorías TRAINING, PROCESS, INFRASTRUCTURE, DOCUMENTATION, TECHNOLOGY, SUPPLIERS, OTHER."
      security: [{FirebaseBearer: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ResearchNeedRequest"}}}
      responses:
        "201":
          description: Registrada.
          content: {application/json: {schema: {$ref: "#/components/schemas/ResearchObjectResponse"}}}
        default: {$ref: "#/components/responses/ResearchError"}
  /api/v1/organizations/{organizationID}/training/assignments:
