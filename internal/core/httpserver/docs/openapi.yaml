    post: {"tags": ["Alertas"], "summary": "Marcar un aviso propio como atendido", "description": "Intrínsecamente idempotente y monotónico, sin Idempotency-Key. ATTEND también fija viewedAt si faltaba. Una auditoría por cambio real; no resuelve el recurso de negocio. Confirmar respuesta antes de actualizar la UI. JSON UTF8 estricto hasta 512 KiB; rechaza claves repetidas, campos y filtros desconocidos. Sesión y permisos se revalidan en cada solicitud.", "operationId": "attendPersonalAlert", "security": [{"FirebaseBearer": []}], "responses": {"200": {"description": "Operación confirmada.", "headers": {"X-BPM-Session-Expires-At": {"description": "Límite absoluto de sesión en segundos Unix.", "schema": {"type": "integer", "format": "int64"}}, "X-BPM-Session-Idle-Expires-At": {"description": "Límite de inactividad en segundos Unix.", "schema": {"type": "integer", "format": "int64"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AlertResponse"}}}}, "default": {"$ref": "#/components/responses/AlertError"}}, "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/EmptyAlertCommand"}}}}}
components:
  parameters:
    PageSize:
      in: query
      name: pageSize
      description: Tamaño de página. Nuevos endpoints usan 25; endpoints existentes sin query conservan 100.
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
    PageToken:
      in: query
      name: pageToken
      description: Cursor de continuación devuelto por el servidor. Reutilizar con el mismo usuario, tenant, recurso y búsqueda; no concede permisos. Cambiar pageSize está permitido.
      schema: {type: string, maxLength: 2048, pattern: '^[A-Za-z0-9_-]*$'}
    SearchQuery:
      in: query
      name: query
      description: Subcadena literal sin distinción de mayúsculas. Máximo 160 caracteres, sin controles; no admite comodines SQL.
      schema: {type: string, maxLength: 160}
    OrganizationID:
      in: path
      name: organizationID
      required: true
      description: Se autoriza contra membresía activa; enviar un ID no concede acceso.
      schema: {type: string, maxLength: 64}
    ChecklistAssignmentID:
      in: path
      name: assignmentID
      required: true
      schema: {type: string, format: uuid}
    ChecklistRunID:
      in: path
      name: runID
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: {type: string, minLength: 8, maxLength: 100}
  securitySchemes:
    FirebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
      description: ID token emitido por Firebase Authentication.
  responses:
    AlertError:
      description: "400 INVALID_REQUEST/INVALID_PAGINATION; 401 UNAUTHENTICATED/SESSION_EXPIRED; 403 ACCESS_DENIED; 404 NOT_FOUND; 409 RESOURCE_CONFLICT; 415 JSON requerido; 422 VALIDATION_ERROR; 429 RATE_LIMITED; 500 INTERNAL_ERROR sanitizado; 503 dependencia no disponible. JSON UTF8 estricto máximo 512 KiB, respuesta del proxy máximo 4 MiB; nunca expone correos, tokens, cuerpos internos ni configuración del proveedor."
      headers: {"X-BPM-Session-Expires-At": {"description": "Límite absoluto de sesión en segundos Unix.", "schema": {"type": "integer", "format": "int64"}}, "X-BPM-Session-Idle-Expires-At": {"description": "Límite de inactividad en segundos Unix.", "schema": {"type": "integer", "format": "int64"}}}
      content: {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}
    IncidentError:
      description: 400 INVALID_REQUEST/INVALID_PAGINATION; 401 UNAUTHENTICATED/SESSION_EXPIRED;
        403 ACCESS_DENIED; 404 NOT_FOUND; 409 RESOURCE_CONFLICT; 415 JSON requerido; 422
        VALIDATION_ERROR con fields; 429 RATE_LIMITED; 500 INTERNAL_ERROR sanitizado; 503
        dependencia no disponible. Entradas JSON estrictas UTF8 hasta 512 KiB, proxy con
        respuesta máxima 4 MiB. Rechaza campos, métodos y filtros desconocidos.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    MediaError:
      description: >-
        400 INVALID_REQUEST; 401 UNAUTHENTICATED/SESSION_EXPIRED; 403 ACCESS_DENIED o correo sin verificar;
        404 NOT_FOUND; 409 RESOURCE_CONFLICT o UPLOAD_NOT_READY (aún no existe objeto);
        422 VALIDATION_ERROR, MEDIA_CONTENT_INVALID (FAILED) o MEDIA_LIMIT_REACHED;
        503 MEDIA_UNAVAILABLE; 500 INTERNAL_ERROR sanitizado.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    InvalidPagination:
      description: 400 INVALID_PAGINATION; cursor mal formado, contexto distinto o parámetros inválidos/repetidos/desconocidos. Reiniciar la lista con cursor vacío.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    WorkspaceError:
      description: 400 JSON inválido; 401 sesión inválida; 403 sin permiso/correo sin verificar; 404 cuenta no disponible; 409 conflicto; 415 no JSON; 422 fields inválidos; 429 límite; 500/503 fallo sanitizado.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    Unauthenticated:
      description: Token ausente, inválido, vencido o revocado; SESSION_EXPIRED si el contexto BPM venció o fue cerrado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Error interno sanitizado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Dependencia técnica o autenticación no disponible.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Pagination:
      type: object
      required: [nextPageToken]
      properties:
        nextPageToken: {type: string, maxLength: 2048, description: Cadena vacía al terminar la lista.}
    ChecklistItem:
      type: object
      additionalProperties: false
      required: [id, sectionName, label, responseType, displayOrder, required]
      properties:
        id: {type: string, format: uuid}
        sectionName: {type: string, maxLength: 120}
        label: {type: string, maxLength: 300}
        responseType: {type: string, enum: [COMPLIANCE, TEMPERATURE, TEXT, NUMBER]}
        unit: {type: string, maxLength: 20}
        displayOrder: {type: integer, minimum: 1}
        required: {type: boolean}
        minimumValue: {type: number, nullable: true}
        maximumValue: {type: number, nullable: true}
        evidenceRequiredOnFailure: {type: boolean, description: La API todavía no permite true.}
    ChecklistTemplate:
      type: object
      additionalProperties: false
      required: [id, name, area, versionId, items]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, maxLength: 180}
        description: {type: string, maxLength: 500}
        area: {type: string, maxLength: 80}
        versionId: {type: string, format: uuid}
        versionNumber: {type: integer, readOnly: true}
        items:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: "#/components/schemas/ChecklistItem"}
    ChecklistAnswer:
      type: object
      additionalProperties: false
      required: [itemId]
      properties:
        itemId: {type: string, format: uuid}
        complianceResult: {type: string, enum: [COMPLIANT, NON_COMPLIANT, NOT_APPLICABLE]}
        textValue: {type: string, maxLength: 2000}
        observation: {type: string, maxLength: 2000}
        numericValue: {type: number, nullable: true}
    ChecklistAssignmentCreate:
      type: object
      additionalProperties: false
      required: [id, templateId, locationId, frequency]
      properties:
        id: {type: string, format: uuid}
        templateId: {type: string, format: uuid}
        locationId: {type: string, format: uuid}
        frequency: {type: string, enum: [ONCE, DAILY, WEEKLY, MONTHLY]}
        dueTime: {type: string, pattern: '^(|([01][0-9]|2[0-3]):[0-5][0-9])$', description: "Hora de referencia local opcional. No activa notificaciones ni bloquea el inicio."}
    ChecklistAssignedRun:
      type: object
      additionalProperties: false
      required: [id, status, performedBy, performedByName, createdAt, submittedAt]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [DRAFT, SUBMITTED]}
        performedBy: {type: string, maxLength: 128}
        performedByName: {type: string, maxLength: 200}
        createdAt: {type: string, format: date-time}
        submittedAt: {type: string, format: date-time, nullable: true}
    ChecklistAssignment:
      type: object
      additionalProperties: false
      required: [id, templateId, templateName, templateVersionId, locationId, locationName, frequency, dueTime, timezone, active, createdAt, periodStartsAt, periodEndsAt, run]
      properties:
        id: {type: string, format: uuid}
        templateId: {type: string, format: uuid}
        templateName: {type: string, maxLength: 180}
        templateVersionId: {type: string, format: uuid, description: Última versión publicada; cada revisión iniciada conserva su versión inmutable.}
        locationId: {type: string, format: uuid}
        locationName: {type: string, maxLength: 160}
        frequency: {type: string, enum: [ONCE, DAILY, WEEKLY, MONTHLY]}
        dueTime: {type: string, description: "Hora local HH:MM o cadena vacía."}
        timezone: {type: string, description: Zona IANA de la sede.}
        active: {type: boolean}
        createdAt: {type: string, format: date-time}
        periodStartsAt: {type: string, format: date-time, nullable: true, description: "Incluyente. GET lo calcula; POST puede devolver null."}
        periodEndsAt: {type: string, format: date-time, nullable: true, description: "Excluyente; ONCE no termina. Día local, semana desde lunes o mes calendario."}
        run:
          type: object
          allOf: [{$ref: "#/components/schemas/ChecklistAssignedRun"}]
          nullable: true
          description: Revisión iniciada en el período consultado, o null.
    ChecklistAssignmentEnvelope:
      type: object
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/ChecklistAssignment"}
    ChecklistRunCreate:
      type: object
      additionalProperties: false
      required: [id, locationId, templateVersionId, clientOperationId, clientCreatedAt]
      properties:
        id: {type: string, format: uuid}
        locationId: {type: string, format: uuid}
        templateVersionId: {type: string, format: uuid}
        clientOperationId: {type: string, format: uuid}
        clientCreatedAt: {type: string, format: date-time}
        assignmentId: {type: string, description: "UUID de programación o vacío para revisión sin programación activa."}
    ChecklistRunSummary:
      type: object
      additionalProperties: false
      required: [id, templateName, locationId, locationName, performedBy, performedByName, status, createdAt, answerCount, questionCount]
      properties:
        id: {type: string, format: uuid}
        templateName: {type: string}
        locationId: {type: string, format: uuid}
        locationName: {type: string}
        performedBy: {type: string}
        performedByName: {type: string}
        status: {type: string, enum: [DRAFT, SUBMITTED]}
        createdAt: {type: string, format: date-time}
        submittedAt: {type: string, format: date-time, nullable: true}
        compliancePercent: {type: number, minimum: 0, maximum: 100, nullable: true}
        answerCount: {type: integer, minimum: 0, maximum: 100}
        questionCount: {type: integer, minimum: 1, maximum: 100}
    ChecklistRun:
      type: object
      required: [id, organizationId, locationId, templateVersionId, performedBy, clientOperationId, clientCreatedAt, status, rowVersion, items, answers]
      properties:
        templateName: {type: string}
        locationName: {type: string}
        createdAt: {type: string, format: date-time}
        id: {type: string, format: uuid}
        organizationId: {type: string}
        assignmentId: {type: string, description: "UUID de programación o vacío en revisión libre."}
        locationId: {type: string, format: uuid}
        templateVersionId: {type: string, format: uuid}
        performedBy: {type: string}
        clientOperationId: {type: string, format: uuid}
        clientCreatedAt: {type: string, format: date-time}
        status: {type: string, enum: [DRAFT, SUBMITTED, CANCELLED]}
        rowVersion: {type: integer}
        compliancePercent: {type: number, nullable: true}
        submittedAt: {type: string, format: date-time, nullable: true}
        items:
          type: array
          items: {$ref: "#/components/schemas/ChecklistItem"}
        answers:
          type: array
          items: {$ref: "#/components/schemas/ChecklistAnswer"}
        evidenceCounts:
          type: object
          description: Recuento confirmado AVAILABLE por UUID de pregunta, calculado por servidor.
          additionalProperties: {type: integer, minimum: 0, maximum: 3}
    WorkspaceOrganization:
      type: object
      additionalProperties: false
      required: [id, legalName, businessType]
      properties:
        id: {type: string, format: uuid}
        legalName: {type: string, minLength: 2, maxLength: 200}
        tradeName: {type: string, maxLength: 200}
        taxId: {type: string, maxLength: 20}
        businessType: {type: string, enum: [RESTAURANT, CAFETERIA, CATERING, RELATED_SERVICE]}
        contactName: {type: string, maxLength: 160, description: "Nombre personal opcional: letras, diacríticos, espacios, apóstrofos y guiones; sin números."}
        contactPhone: {type: string, maxLength: 30, description: "Opcional. De 7 a 15 dígitos; permite + inicial, espacios, guiones y paréntesis."}
        contactEmail: {type: string, maxLength: 320, description: "Opcional. Correo completo con dominio con punto, sin controles; hasta 320 bytes."}
    WorkspaceLocation:
      type: object
      additionalProperties: false
      required: [id, name, address]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 2, maxLength: 160}
        address: {type: string, minLength: 3, maxLength: 300}
        district: {type: string, maxLength: 120}
        contactPhone: {type: string, maxLength: 30, description: "Opcional. De 7 a 15 dígitos; permite + inicial, espacios, guiones y paréntesis."}
        timezone: {type: string, readOnly: true, example: America/Lima}
    WorkspaceMember:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        email: {type: string, format: email}
        role: {type: string, enum: [ADMIN, CHEF, WORKER]}
        locationIds:
          type: array
          items: {type: string, format: uuid}
    WorkspaceEntry:
      type: object
      properties:
        id: {type: string}
        title: {type: string}
        detail: {type: string}
        status: {type: string}
    Workspace:
      type: object
      properties:
        nextPageTokens:
          type: object
          description: Cursores independientes para locations, members, courses, checklist-summaries e incidents.
          additionalProperties: {type: string, maxLength: 2048}
        totals:
          type: object
          readOnly: true
          properties:
            locations: {type: integer, minimum: 0}
            courses: {type: integer, minimum: 0}
            checklists: {type: integer, minimum: 0}
        organization: {$ref: "#/components/schemas/WorkspaceOrganization"}
        role: {type: string, enum: [SUPER_ADMIN, ADMIN, CHEF, WORKER]}
        locations:
          type: array
          items: {$ref: "#/components/schemas/WorkspaceLocation"}
        members:
          type: array
          items: {$ref: "#/components/schemas/WorkspaceMember"}
        courses:
          type: array
          items: {$ref: "#/components/schemas/WorkspaceEntry"}
        checklists:
          type: array
          items: {$ref: "#/components/schemas/WorkspaceEntry"}
        incidents:
          type: array
          items: {$ref: "#/components/schemas/WorkspaceEntry"}
    HealthResponse:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          description: SHA del commit desplegado o versión configurada.
    ReadyResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ready
    APIInfoResponse:
      type: object
      required: [name, version]
      properties:
        name:
          type: string
          example: bpm-api
        version:
          type: string
    ProfileEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Profile"
    Profile:
      type: object
      required: [id, email, displayName, platformRole, organizations]
      properties:
        id:
          type: string
          description: UID verificado de Firebase.
        email:
          type: string
          format: email
        displayName:
          type: string
        phoneNumber:
          type: string
        platformRole:
          type: string
          enum: [USER, SUPER_ADMIN]
        organizations:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationMembership"
    OrganizationMembership:
      type: object
      required: [id, legalName, role, locations]
      properties:
        id:
          type: string
          format: uuid
        legalName:
          type: string
        tradeName:
          type: string
        role:
          type: string
          enum: [ADMIN, CHEF, WORKER]
        locations:
          type: array
          items:
            $ref: "#/components/schemas/Location"
    Location:
      type: object
      required: [id, name, address, timezone]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string
        addressReference:
          type: string
        district:
          type: string
        province:
          type: string
        department:
          type: string
        timezone:
          type: string
          example: America/Lima
    ErrorResponse:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/APIError"
        requestId:
          type: string
    APIError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: UNAUTHENTICATED
        message:
          type: string
          example: Se requiere autenticación.
        fields:
          type: object
          additionalProperties:
            type: string

    EmptyObject:
      type: object
      additionalProperties: false
    EvidenceUpload:
      oneOf:
      - "$ref": "#/components/schemas/EvidenceChecklistUpload"
      - "$ref": "#/components/schemas/EvidenceIncidentBeforeUpload"
      - "$ref": "#/components/schemas/EvidenceIncidentAfterUpload"
      description: 'Exactamente un destino: pregunta de control, BEFORE sin actionId o AFTER
        con actionId. runId/itemId se conservan vacíos para archivos de incidencia.'
    EvidenceFile:
      oneOf:
      - "$ref": "#/components/schemas/EvidenceChecklistFile"
      - "$ref": "#/components/schemas/EvidenceIncidentBeforeFile"
      - "$ref": "#/components/schemas/EvidenceIncidentAfterFile"
      description: 'Exactamente un destino: pregunta de control, BEFORE sin actionId o AFTER
        con actionId. runId/itemId se conservan vacíos para archivos de incidencia.'
    EvidenceTicket:
      type: object
      additionalProperties: false
      required: [url, headers, expiresAt]
      description: >-
        Credencial temporal. No persistir, registrar, compartir ni enviar el Bearer a R2.
        PUT debe usar headers devueltos, incluidos If-None-Match y Content-Type.
        Un 412 exige confirmar la reserva antes de decidir otro envío. Descarga solo AVAILABLE.
      properties:
        url: {type: string, format: uri}
        headers:
          type: object
          additionalProperties:
            type: array
            items: {type: string}
        expiresAt: {type: string, format: date-time}
    EvidenceReservation:
      type: object
      required: [file, upload]
      properties:
        file: {$ref: "#/components/schemas/EvidenceFile"}
        upload:
          nullable: true
          allOf: [{$ref: "#/components/schemas/EvidenceTicket"}]
    EvidenceList:
      type: object
      required: [files, maxBytes, allowedMimeTypes, maxFiles, uploadAvailable]
      properties:
        files:
          type: array
          items: {$ref: "#/components/schemas/EvidenceFile"}
        maxBytes: {type: integer, format: int64, minimum: 1048576, maximum: 26214400}
        allowedMimeTypes:
          type: array
          items: {type: string, enum: [image/jpeg, image/png]}
        maxFiles: {type: integer, enum: [3]}
        uploadAvailable: {type: boolean}

    OperationSupplier:
      type: object
      additionalProperties: false
      required: ["id", "name"]
      properties:
        id: {"type": "string", "format": "uuid"}
        name: {"type": "string", "maxLength": 200, "minLength": 2}
        taxId: {"type": "string", "maxLength": 20}
        contactName: {"type": "string", "maxLength": 160}
        contactPhone: {"type": "string", "maxLength": 30}
        contactEmail: {"type": "string", "maxLength": 320}
        address: {"type": "string", "maxLength": 300}
    OperationProductInput:
      type: object
