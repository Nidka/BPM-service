      security: [{FirebaseBearer: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ResearchConsentDocumentRequest"}}}
      responses:
        "201":
          description: Publicado.
          content: {application/json: {schema: {$ref: "#/components/schemas/ResearchObjectResponse"}}}
        default: {$ref: "#/components/responses/ResearchError"}
  /api/v1/research/instruments:
    get:
      tags: [Investigación]
      operationId: listResearchInstruments
      summary: Listar instrumentos
