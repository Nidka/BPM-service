    delete:
      tags: [Investigación]
      operationId: revokeResearchAccess
      summary: Revocar acceso de investigación
      description: "Solo SUPER_ADMIN."
      security: [{FirebaseBearer: []}]
      responses:
        "204":
          description: Revocado.
        default: {$ref: "#/components/responses/ResearchError"}
  /api/v1/research/consent-documents:
    get:
      tags: [Investigación]
      operationId: listConsentDocuments
      summary: Listar documentos de consentimiento
      description: "Investigador."
      security: [{FirebaseBearer: []}]
      parameters:
      - {in: query, name: pageSize, schema: {type: integer, minimum: 1, maximum: 100}}
      - {in: query, name: pageToken, schema: {type: string}}
      responses:
        "200":
          description: Correcto.
          content: {application/json: {schema: {$ref: "#/components/schemas/ResearchListResponse"}}}
        default: {$ref: "#/components/responses/ResearchError"}
    post:
      tags: [Investigación]
      operationId: publishConsentDocument
