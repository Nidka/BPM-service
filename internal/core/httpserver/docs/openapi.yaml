      operationId: publishResearchDraft
      summary: Publicar el borrador
      description: "Investigador. Inmutable al publicar. CAP: exactamente 8 opción múltiple, 8 Likert y 10 de frecuencia, con respuesta correcta en cada opción múltiple (422 RESEARCH_INSTRUMENT_INCOMPLETE)."
      security: [{FirebaseBearer: []}]
      responses:
        "200":
          description: Correcto.
          content: {application/json: {schema: {$ref: "#/components/schemas/ResearchObjectResponse"}}}
        default: {$ref: "#/components/responses/ResearchError"}
  /api/v1/research/organizations:
    get:
      tags: [Investigación]
      operationId: listResearchOrganizations
      summary: Listar empresas
      description: "Investigador."
      security: [{FirebaseBearer: []}]
      parameters:
      - {in: query, name: pageSize, schema: {type: integer, minimum: 1, maximum: 100}}
      - {in: query, name: pageToken, schema: {type: string}}
      responses:
        "200":
          description: Correcto.
          content: {application/json: {schema: {$ref: "#/components/schemas/ResearchListResponse"}}}
        default: {$ref: "#/components/responses/ResearchError"}
  /api/v1/research/results:
    get:
      tags: [Investigación]
      operationId: getResearchResults
      summary: Resultados consolidados por empresa (RF-26)
      description: "Investigador. n, medias por dimensión y comparación pre vs post; excluye participantes que retiraron su consentimiento. instrumentVersionId opcional (por defecto la CAP publicada)."
      security: [{FirebaseBearer: []}]
      parameters:
      - {in: query, name: pageSize, schema: {type: integer, minimum: 1, maximum: 100}}
      - {in: query, name: pageToken, schema: {type: string}}
      - {in: query, name: instrumentVersionId, schema: {type: string}}
      responses:
        "200":
          description: Correcto.
          content: {application/json: {schema: {$ref: "#/components/schemas/ResearchListResponse"}}}
        default: {$ref: "#/components/responses/ResearchError"}
  /api/v1/research/exports/responses.csv:
    get:
      tags: [Investigación]
