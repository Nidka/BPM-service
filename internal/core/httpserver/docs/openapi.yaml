        default: {$ref: "#/components/responses/ResearchError"}
  /api/v1/research/instruments/import:
    post:
      tags: [Investigación]
      operationId: importResearchInstrument
      summary: Importar instrumento desde JSON
      description: "Investigador. Acepta el formato de docs/research/cap-instrument.json (source y generalData se ignoran). Crea un borrador; las respuestas correctas pueden faltar hasta publicar."
      security: [{FirebaseBearer: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ResearchInstrumentRequest"}}}
      responses:
        "201":
          description: Borrador creado.
          content: {application/json: {schema: {$ref: "#/components/schemas/ResearchObjectResponse"}}}
        default: {$ref: "#/components/responses/ResearchError"}
  /api/v1/research/instruments/{instrumentID}:
    parameters:
    - {in: path, name: instrumentID, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Investigación]
      operationId: getResearchInstrument
      summary: Instrumento y versiones
      description: "Investigador."
      security: [{FirebaseBearer: []}]
      responses:
        "200":
          description: Correcto.
          content: {application/json: {schema: {$ref: "#/components/schemas/ResearchObjectResponse"}}}
        default: {$ref: "#/components/responses/ResearchError"}
  /api/v1/research/instruments/{instrumentID}/draft:
    parameters:
    - {in: path, name: instrumentID, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Investigación]
      operationId: getResearchDraft
      summary: Borrador con respuestas correctas
      description: "Investigador."
      security: [{FirebaseBearer: []}]
      responses:
        "200":
          description: Correcto.
          content: {application/json: {schema: {$ref: "#/components/schemas/ResearchObjectResponse"}}}
        default: {$ref: "#/components/responses/ResearchError"}
    put:
      tags: [Investigación]
      operationId: saveResearchDraft
      summary: Reemplazar preguntas del borrador
      description: "Investigador. Control optimista con rowVersion (409 RESEARCH_DRAFT_CONFLICT)."
      security: [{FirebaseBearer: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ResearchDraftRequest"}}}
      responses:
        "200":
          description: Correcto.
          content: {application/json: {schema: {$ref: "#/components/schemas/ResearchObjectResponse"}}}
        default: {$ref: "#/components/responses/ResearchError"}
  /api/v1/research/instruments/{instrumentID}/versions:
    parameters:
    - {in: path, name: instrumentID, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Investigación]
      operationId: createResearchDraft
      summary: Abrir nueva versión
      description: "Investigador. Copia la última publicada (409 RESEARCH_DRAFT_EXISTS si ya hay borrador)."
      security: [{FirebaseBearer: []}]
      responses:
        "201":
          description: Borrador creado.
          content: {application/json: {schema: {$ref: "#/components/schemas/ResearchObjectResponse"}}}
        default: {$ref: "#/components/responses/ResearchError"}
  /api/v1/research/instruments/{instrumentID}/publish:
