    ChecklistMissingAlertConfiguration:
      type: "object"
      additionalProperties: false
      required: ["afterLocalTime"]
      properties: {"afterLocalTime": {"type": "string", "pattern": "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$", "description": "Hora de la sede; solo asignaciones DAILY activas de plantilla PUBLISHED sin ejecución SUBMITTED para el día local."}}
    TemperatureDangerAlertConfiguration:
      type: "object"
      additionalProperties: false
      required: ["minimumTemperatureCelsius", "maximumTemperatureCelsius"]
      properties: {"minimumTemperatureCelsius": {"type": "number", "minimum": -9999.99, "maximum": 9999.99, "multipleOf": 0.01}, "maximumTemperatureCelsius": {"type": "number", "minimum": -9999.99, "maximum": 9999.99, "multipleOf": 0.01}}
      description: "Intervalo inclusivo, mínimo menor que máximo. Configuración explícita del operador; no se publica un rango sanitario predeterminado."
    OrganizationInactiveAlertConfiguration:
      type: "object"
      additionalProperties: false
      required: ["inactivityDays"]
      properties: {"inactivityDays": {"type": "integer", "minimum": 1, "maximum": 365}}
      description: "Sin sede: un aviso por episodio a ADMIN activo; actividad de negocio del servidor, nunca login ni fecha futura del cliente."
    TrainingAssignedAlertConfiguration:
      type: "object"
      additionalProperties: false
      required: []
      properties: {}
      description: "Solo asignaciones ACTIVE de cursos PUBLISHED creadas desde la regla, a usuario/rol/sede vigentes. No genera contenidos ni asignaciones."
    CreateAlertRule:
      type: "object"
      additionalProperties: false
      required: ["id", "name", "type", "configuration", "active", "emailEnabled", "pushEnabled"]
      properties: {"id": {"type": "string", "format": "uuid", "description": "UUID canónico en minúsculas; mayúsculas aceptadas y normalizadas en la entrada."}, "locationId": {"type": "string", "format": "uuid", "description": "UUID canónico en minúsculas; mayúsculas aceptadas y normalizadas en la entrada.", "nullable": true}, "name": {"type": "string", "minLength": 2, "maxLength": 160, "description": "Nombre sin controles Unicode; se recortan espacios externos."}, "type": {"type": "string", "enum": ["CHECKLIST_MISSING", "TEMPERATURE_DANGER", "ORGANIZATION_INACTIVE", "TRAINING_ASSIGNED"]}, "configuration": {"oneOf": [{"$ref": "#/components/schemas/ChecklistMissingAlertConfiguration"}, {"$ref": "#/components/schemas/TemperatureDangerAlertConfiguration"}, {"$ref": "#/components/schemas/OrganizationInactiveAlertConfiguration"}, {"$ref": "#/components/schemas/TrainingAssignedAlertConfiguration"}], "description": "La forma coincide exclusivamente con type. No se aceptan claves desconocidas o repetidas."}, "active": {"type": "boolean"}, "emailEnabled": {"type": "boolean"}, "pushEnabled": {"type": "boolean"}}
      description: "ADMIN/SUPER_ADMIN de la organización. Todos los booleanos son obligatorios, incluido false; locationId omitido o null significa empresa. ORGANIZATION_INACTIVE siempre tiene locationId null. ID estable y replay con la misma Idempotency-Key."
    UpdateAlertRule:
      type: "object"
      additionalProperties: false
      required: ["name", "type", "configuration", "active", "emailEnabled", "pushEnabled", "rowVersion"]
      properties: {"locationId": {"type": "string", "format": "uuid", "description": "UUID canónico en minúsculas; mayúsculas aceptadas y normalizadas en la entrada.", "nullable": true}, "name": {"type": "string", "minLength": 2, "maxLength": 160, "description": "Nombre sin controles Unicode; se recortan espacios externos."}, "type": {"type": "string", "enum": ["CHECKLIST_MISSING", "TEMPERATURE_DANGER", "ORGANIZATION_INACTIVE", "TRAINING_ASSIGNED"]}, "configuration": {"oneOf": [{"$ref": "#/components/schemas/ChecklistMissingAlertConfiguration"}, {"$ref": "#/components/schemas/TemperatureDangerAlertConfiguration"}, {"$ref": "#/components/schemas/OrganizationInactiveAlertConfiguration"}, {"$ref": "#/components/schemas/TrainingAssignedAlertConfiguration"}], "description": "La forma coincide exclusivamente con type. No se aceptan claves desconocidas o repetidas."}, "active": {"type": "boolean"}, "emailEnabled": {"type": "boolean"}, "pushEnabled": {"type": "boolean"}, "rowVersion": {"type": "integer", "minimum": 1, "maximum": 9007199254740991}}
      description: "Control optimista: rowVersion de la versión consultada. Type y locationId deben coincidir con la regla existente; crear otra regla para cambiar ámbito o tipo. Los avisos existentes conservan su snapshot."
    AlertRule:
      type: "object"
      additionalProperties: false
      required: ["id", "locationId", "locationName", "name", "type", "configuration", "active", "emailEnabled", "pushEnabled", "rowVersion"]
      properties: {"id": {"type": "string", "format": "uuid", "description": "UUID canónico en minúsculas; mayúsculas aceptadas y normalizadas en la entrada."}, "locationId": {"type": "string", "format": "uuid", "description": "UUID canónico en minúsculas; mayúsculas aceptadas y normalizadas en la entrada.", "nullable": true}, "locationName": {"type": "string", "maxLength": 160}, "name": {"type": "string", "minLength": 2, "maxLength": 160, "description": "Nombre sin controles Unicode; se recortan espacios externos."}, "type": {"type": "string", "enum": ["CHECKLIST_MISSING", "TEMPERATURE_DANGER", "ORGANIZATION_INACTIVE", "TRAINING_ASSIGNED"]}, "configuration": {"oneOf": [{"$ref": "#/components/schemas/ChecklistMissingAlertConfiguration"}, {"$ref": "#/components/schemas/TemperatureDangerAlertConfiguration"}, {"$ref": "#/components/schemas/OrganizationInactiveAlertConfiguration"}, {"$ref": "#/components/schemas/TrainingAssignedAlertConfiguration"}], "description": "La forma coincide exclusivamente con type. No se aceptan claves desconocidas o repetidas."}, "active": {"type": "boolean"}, "emailEnabled": {"type": "boolean"}, "pushEnabled": {"type": "boolean"}, "rowVersion": {"type": "integer", "minimum": 1, "maximum": 9007199254740991}}
    Alert:
      type: "object"
      additionalProperties: false
      required: ["id", "type", "title", "message", "status", "createdAt", "locationName", "sourceType", "sourceId", "sourceAvailable"]
      properties: {"id": {"type": "string", "format": "uuid", "description": "UUID canónico en minúsculas; mayúsculas aceptadas y normalizadas en la entrada."}, "type": {"type": "string", "enum": ["CHECKLIST_MISSING", "TEMPERATURE_DANGER", "ORGANIZATION_INACTIVE", "TRAINING_ASSIGNED"]}, "title": {"type": "string", "maxLength": 160}, "message": {"type": "string", "description": "Mensaje público del aviso. El proxy limita la respuesta completa a 4 MiB."}, "status": {"type": "string", "enum": ["PENDING", "SENT", "VIEWED", "ATTENDED", "CANCELLED"]}, "createdAt": {"type": "string", "format": "date-time"}, "viewedAt": {"type": "string", "format": "date-time", "nullable": true}, "attendedAt": {"type": "string", "format": "date-time", "nullable": true}, "locationId": {"type": "string", "format": "uuid", "description": "UUID canónico en minúsculas; mayúsculas aceptadas y normalizadas en la entrada.", "nullable": true}, "locationName": {"type": "string", "maxLength": 160}, "timezone": {"type": "string", "nullable": true, "maxLength": 100, "description": "Zona IANA de la sede si está disponible."}, "sourceType": {"type": "string", "enum": ["CHECKLIST_ASSIGNMENT", "RECEIPT_ITEM", "TRAINING_ASSIGNMENT", "ORGANIZATION"]}, "sourceId": {"type": "string", "maxLength": 64, "description": "UUID para asignación o ítem; ID textual de empresa para ORGANIZATION."}, "sourceParentId": {"type": "string", "format": "uuid", "description": "UUID canónico en minúsculas; mayúsculas aceptadas y normalizadas en la entrada.", "nullable": true}, "sourceAvailable": {"type": "boolean"}}
      description: "Bandeja privada del destinatario; ADMIN no ve avisos ajenos. Revalida membresía/rol/sede/fuente en cada lectura y acuse. sourceParentId es receiptID para un ítem cuando se entrega. SENT legado es no visto si viewedAt es null. Enviar a un proveedor no altera status ni las fechas de lectura/atención."
