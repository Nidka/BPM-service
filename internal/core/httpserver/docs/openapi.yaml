  /api/v1/organizations/{organizationID}/incidents/{incidentID}/actions:
    parameters:
    - "$ref": "#/components/parameters/OrganizationID"
    - name: incidentID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      tags:
      - Incidencias
      operationId: commandIncident
      summary: Asignar, atender o verificar una incidencia
      description: 'ASSIGN: supervisor, responsable elegible y plazo futuro; START/RESOLVE:
        solo responsable; VERIFY/RETURN: supervisor distinto del ejecutor. RETURN exige
        motivo. Excepción: si el responsable es ADMIN/CHEF supervisor y no existe otro ADMIN
        activo ni CHEF activo con acceso a la sede, puede hacer VERIFY de su propia acción (con
        nota obligatoria; sin nota 422); queda `selfValidated: true` y auditoría
        incident.SELF_VERIFY. RETURN propio sigue prohibido. VERIFY exige evidencia AVAILABLE BEFORE y AFTER de la acción si el criterio
        lo exige. Incidencias con múltiples acciones legadas rechazan comandos que requieren
        acción única. Transición, evento, auditoría e idempotencia son atómicos; conflicto
        de rowVersion devuelve 409.'
      security:
      - FirebaseBearer: []
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/IncidentCommandInput"
