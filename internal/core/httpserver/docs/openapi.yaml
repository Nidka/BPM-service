      parameters:
      - {in: query, name: pageSize, schema: {type: integer, minimum: 1, maximum: 100}}
      - {in: query, name: pageToken, schema: {type: string}}
      responses:
        "200":
          description: Correcto.
          content: {application/json: {schema: {$ref: "#/components/schemas/ResearchListResponse"}}}
        default: {$ref: "#/components/responses/ResearchError"}
    post:
      tags: [Investigación]
      operationId: createResearchInstrument
      summary: Crear instrumento en borrador
      description: "Investigador. Crea la versión 1 en borrador."
      security: [{FirebaseBearer: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ResearchInstrumentRequest"}}}
      responses:
        "201":
          description: Borrador creado.
