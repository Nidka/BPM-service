      - {$ref: "#/components/parameters/ChecklistRunID"}
    put:
      tags: [Checklists]
      summary: Reemplazar respuestas de un borrador
      operationId: saveChecklistAnswers
      description: Solo el ejecutor. Requiere rowVersion actual e Idempotency-Key de 8 a 100 caracteres visibles. El mismo cuerpo/clave devuelve la respuesta original; otra versión da 409 VERSION_CONFLICT. No modifica ejecuciones enviadas.
