      type: object
      required: [id, locationId, name, startTime, endTime, timezone, crossesMidnight, active, openNow, rowVersion, createdAt]
      properties:
        id: {type: string, format: uuid}
        locationId: {type: string, format: uuid}
        name: {type: string}
        startTime: {type: string, example: "06:00"}
        endTime: {type: string, example: "14:00"}
        timezone: {type: string, example: America/Lima}
        crossesMidnight: {type: boolean}
        active: {type: boolean}
        openNow: {type: boolean}
        rowVersion: {type: integer}
        createdAt: {type: string, format: date-time}
    ShiftInput:
      type: object
      additionalProperties: false
      required: [id, locationId, name, startTime, endTime]
      properties:
        id: {type: string, format: uuid}
        locationId: {type: string, format: uuid}
        name: {type: string, minLength: 2, maxLength: 60}
        startTime: {type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"}
        endTime: {type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"}
    StockMovementInput:
      type: object
      additionalProperties: false
      required: [id, locationId, lotId, type, quantity, clientOperationId, clientCreatedAt]
      properties:
        id: {type: string, format: uuid}
        locationId: {type: string, format: uuid}
        lotId: {type: string, format: uuid}
        type: {type: string, enum: [CONSUMPTION, DISCARD]}
        quantity: {type: string, example: "0.5", description: "Decimal exacto mayor que cero, hasta 3 decimales."}
        reason: {type: string, enum: [EXPIRED, DETERIORATED, CONTAMINATION, OTHER], description: "Obligatorio en DISCARD; prohibido en CONSUMPTION."}
        note: {type: string, maxLength: 500, description: "Obligatoria con reason OTHER."}
        clientOperationId: {type: string, format: uuid}
        clientCreatedAt: {type: string, format: date-time}
