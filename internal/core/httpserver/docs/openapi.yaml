    post: {"tags": ["Alertas"], "summary": "Marcar un aviso propio como atendido", "description": "Intrínsecamente idempotente y monotónico, sin Idempotency-Key. ATTEND también fija viewedAt si faltaba. Una auditoría por cambio real; no resuelve el recurso de negocio. Confirmar respuesta antes de actualizar la UI. JSON UTF8 estricto hasta 512 KiB; rechaza claves repetidas, campos y filtros desconocidos. Sesión y permisos se revalidan en cada solicitud.", "operationId": "attendPersonalAlert", "security": [{"FirebaseBearer": []}], "responses": {"200": {"description": "Operación confirmada.", "headers": {"X-BPM-Session-Expires-At": {"description": "Límite absoluto de sesión en segundos Unix.", "schema": {"type": "integer", "format": "int64"}}, "X-BPM-Session-Idle-Expires-At": {"description": "Límite de inactividad en segundos Unix.", "schema": {"type": "integer", "format": "int64"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AlertResponse"}}}}, "default": {"$ref": "#/components/responses/AlertError"}}, "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/EmptyAlertCommand"}}}}}
  /api/v1/organizations/{organizationID}/training/courses:
    parameters:
    - $ref: "#/components/parameters/OrganizationID"
    get:
      tags: [Academia]
      operationId: listTrainingCourses
      summary: Listar cursos para administrar
      description: ADMIN y SUPER_ADMIN. Máximo 100 cursos ordenados por título; el filtro status es opcional y no admite otros parámetros.
      security: [{FirebaseBearer: []}]
      parameters:
      - {in: query, name: status, required: false, schema: {type: string, enum: [DRAFT, PUBLISHED, ARCHIVED]}}
      responses:
        "200":
          description: Cursos de la organización autorizada.
          content: {application/json: {schema: {$ref: "#/components/schemas/TrainingCourseListResponse"}}}
        default: {$ref: "#/components/responses/TrainingError"}
    post:
      tags: [Academia]
      operationId: createTrainingCourse
      summary: Crear un curso en borrador
      description: ADMIN y SUPER_ADMIN. El código se normaliza a mayúsculas y es único por organización (409 TRAINING_COURSE_CODE_TAKEN).
      security: [{FirebaseBearer: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/TrainingCourseRequest"}}}
      responses:
        "201":
          description: Curso creado en estado DRAFT.
          content: {application/json: {schema: {$ref: "#/components/schemas/TrainingCourseCreatedResponse"}}}
        default: {$ref: "#/components/responses/TrainingError"}
  /api/v1/organizations/{organizationID}/training/courses/{courseID}:
    parameters:
    - $ref: "#/components/parameters/OrganizationID"
    - {in: path, name: courseID, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Academia]
      operationId: getTrainingCourse
      summary: Consultar la versión publicada para aprender
      description: Cualquier membresía activa (ADMIN, CHEF, WORKER) y SUPER_ADMIN. Solo la última versión PUBLISHED de un curso PUBLISHED. Las preguntas nunca incluyen correctOption ni explanation; video es null si no existe o no está AVAILABLE. 404 TRAINING_COURSE_NOT_FOUND si no hay versión publicada o el curso es de otra organización.
      security: [{FirebaseBearer: []}]
      responses:
        "200":
          description: Curso, lecciones, preguntas sin respuesta, progreso y constancia propios.
          content: {application/json: {schema: {$ref: "#/components/schemas/TrainingCourseViewResponse"}}}
        default: {$ref: "#/components/responses/TrainingError"}
  /api/v1/organizations/{organizationID}/training/courses/{courseID}/lessons/{lessonID}/video:
    parameters:
    - $ref: "#/components/parameters/OrganizationID"
    - {in: path, name: courseID, required: true, schema: {type: string, format: uuid}}
    - {in: path, name: lessonID, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Academia]
      operationId: getTrainingLessonVideoUrl
      summary: Obtener una URL firmada para reproducir el video de una lección
      description: Sin cuerpo ni query. GET firmado de R2 válido 15 minutos; la respuesta usa Cache-Control no-store y la URL nunca se registra. 404 si la lección no pertenece a la versión publicada o no tiene video AVAILABLE.
      security: [{FirebaseBearer: []}]
      responses:
        "200":
          description: URL temporal de reproducción.
          content: {application/json: {schema: {$ref: "#/components/schemas/TrainingVideoAccessResponse"}}}
        default: {$ref: "#/components/responses/TrainingError"}
  /api/v1/organizations/{organizationID}/training/courses/{courseID}/progress:
    parameters:
    - $ref: "#/components/parameters/OrganizationID"
    - {in: path, name: courseID, required: true, schema: {type: string, format: uuid}}
    put:
      tags: [Academia]
      operationId: saveTrainingProgress
      summary: Guardar la última lección vista
      description: Idempotente por naturaleza. NOT_STARTED pasa a IN_PROGRESS y COMPLETED nunca retrocede. Requiere membresía (SUPER_ADMIN recibe 403). La lección debe ser de la versión publicada.
      security: [{FirebaseBearer: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/TrainingProgressRequest"}}}
      responses:
        "200":
          description: Progreso actualizado.
          content: {application/json: {schema: {$ref: "#/components/schemas/TrainingProgressResponse"}}}
        default: {$ref: "#/components/responses/TrainingError"}
  /api/v1/organizations/{organizationID}/training/courses/{courseID}/study/answers:
    parameters:
    - $ref: "#/components/parameters/OrganizationID"
    - {in: path, name: courseID, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Academia]
      operationId: answerTrainingStudyQuestion
      summary: Practicar una pregunta en modo estudio
      description: Retroalimentación inmediata. No califica, no crea intentos, no otorga XP ni constancia y no persiste nada. 422 si selectedOption está fuera de rango; 404 si la pregunta no es de la versión publicada.
      security: [{FirebaseBearer: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/TrainingStudyRequest"}}}
      responses:
        "200":
          description: Resultado de la respuesta con la opción correcta y su explicación.
          content: {application/json: {schema: {$ref: "#/components/schemas/TrainingStudyResponse"}}}
        default: {$ref: "#/components/responses/TrainingError"}
  /api/v1/organizations/{organizationID}/training/courses/{courseID}/attempts:
    parameters:
    - $ref: "#/components/parameters/OrganizationID"
    - {in: path, name: courseID, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Academia]
      operationId: submitTrainingAttempt
      summary: Enviar un intento calificado (DIAGNOSTIC o FINAL)
      description: |
        Puntaje, aprobación y XP los calcula el servidor; deben responderse todas las preguntas exactamente una vez
        (422 TRAINING_ANSWERS_INVALID con fields). versionId distinto de la publicada vigente responde 409
        TRAINING_VERSION_OUTDATED. Idempotente por id y clientOperationId: repetición idéntica devuelve 200 con el
        mismo resultado; contenido distinto responde 409 IDEMPOTENCY_CONFLICT. Un FINAL aprobado completa el curso,
        otorga XP (10 por correcta, conservando el máximo) y emite una constancia única por usuario y versión.
        attempt.xpEarned es el XP que sumó este intento (curso + módulo + puntos de las insignias otorgadas); un FINAL
        repetido con la misma nota suma 0. Se omite en intentos anteriores a V15, que no guardaron el XP. outcome
        nextCourse sugiere el siguiente curso tras un FINAL aprobado (null en otros casos o si no hay uno).
        Requiere membresía (SUPER_ADMIN recibe 403).
      security: [{FirebaseBearer: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/TrainingAttemptRequest"}}}
      responses:
        "200":
          description: Repetición idéntica de un intento ya registrado.
          content: {application/json: {schema: {$ref: "#/components/schemas/TrainingAttemptResponse"}}}
        "201":
          description: Intento calificado y registrado.
          content: {application/json: {schema: {$ref: "#/components/schemas/TrainingAttemptResponse"}}}
        default: {$ref: "#/components/responses/TrainingError"}
  /api/v1/organizations/{organizationID}/training/courses/{courseID}/draft:
    parameters:
    - $ref: "#/components/parameters/OrganizationID"
    - {in: path, name: courseID, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Academia]
      operationId: getTrainingDraft
      summary: Obtener el borrador editable
      description: ADMIN y SUPER_ADMIN. Si no existe, crea uno copiando la versión publicada con identificadores nuevos (o vacío). Incluye correctOption y explanation; nunca usar para aprender.
      security: [{FirebaseBearer: []}]
      responses:
        "200":
          description: Borrador con rowVersion para control de concurrencia.
          content: {application/json: {schema: {$ref: "#/components/schemas/TrainingDraftResponse"}}}
        default: {$ref: "#/components/responses/TrainingError"}
    put:
      tags: [Academia]
      operationId: saveTrainingDraft
      summary: Reemplazar el borrador
      description: ADMIN y SUPER_ADMIN. Control optimista con version.rowVersion (409 TRAINING_DRAFT_CONFLICT). Límites - título 200, contenido 20000, 50 lecciones, 100 preguntas, 2 a 6 opciones de 300. El cuerpo está acotado por HTTP_MAX_JSON_BODY_BYTES (1 MiB por defecto).
      security: [{FirebaseBearer: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/TrainingDraftRequest"}}}
      responses:
        "200":
          description: Borrador guardado con la nueva rowVersion.
          content: {application/json: {schema: {$ref: "#/components/schemas/TrainingDraftResponse"}}}
        default: {$ref: "#/components/responses/TrainingError"}
  /api/v1/organizations/{organizationID}/training/courses/{courseID}/publish:
    parameters:
    - $ref: "#/components/parameters/OrganizationID"
    - {in: path, name: courseID, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Academia]
      operationId: publishTrainingCourse
      summary: Publicar el borrador
      description: Sin cuerpo. El borrador pasa a PUBLISHED y la versión anterior a ARCHIVED; intentos y constancias previos no cambian. Requiere al menos una lección, una pregunta y todos los videos AVAILABLE (422 TRAINING_DRAFT_INCOMPLETE). Sin borrador responde 404 TRAINING_DRAFT_NOT_FOUND.
      security: [{FirebaseBearer: []}]
      responses:
        "200":
          description: Versión publicada.
          content: {application/json: {schema: {$ref: "#/components/schemas/TrainingPublishResponse"}}}
        default: {$ref: "#/components/responses/TrainingError"}
  /api/v1/organizations/{organizationID}/training/videos/uploads:
    parameters:
    - $ref: "#/components/parameters/OrganizationID"
    post:
      tags: [Academia]
      operationId: reserveTrainingVideoUpload
      summary: Reservar la carga de un video de capacitación
      description: ADMIN y SUPER_ADMIN. Solo video/mp4 y video/webm hasta TRAINING_VIDEO_MAX_BYTES. La clave privada es organizations/{org}/training/videos/{id}.{mp4|webm}. Repetir los mismos metadatos devuelve la misma reserva con una firma nueva; metadatos distintos responden 409 TRAINING_VIDEO_CONFLICT. El cliente envía el PUT directo a R2 con los encabezados indicados.
      security: [{FirebaseBearer: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/TrainingVideoUploadRequest"}}}
      responses:
        "201":
          description: Reserva y PUT firmado de 15 minutos (Cache-Control no-store).
          content: {application/json: {schema: {$ref: "#/components/schemas/TrainingVideoReservationResponse"}}}
        default: {$ref: "#/components/responses/TrainingError"}
  /api/v1/organizations/{organizationID}/training/videos/{mediaID}/confirm:
    parameters:
    - $ref: "#/components/parameters/OrganizationID"
    - {in: path, name: mediaID, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Academia]
      operationId: confirmTrainingVideo
      summary: Confirmar un video cargado
      description: Sin cuerpo. Verifica tamaño y tipo (HEAD), la firma real del formato (MP4 con ftyp en el desplazamiento 4; WebM con 1A 45 DF A3) y el SHA-256 de todo el objeto leído en streaming con tiempo acotado. Coincide - AVAILABLE; no coincide - FAILED con 422 TRAINING_VIDEO_INVALID. Si el objeto aún no existe responde 409 TRAINING_VIDEO_NOT_READY y se puede reintentar. Repetible.
      security: [{FirebaseBearer: []}]
      responses:
        "200":
          description: Video AVAILABLE.
          content: {application/json: {schema: {$ref: "#/components/schemas/TrainingVideoConfirmResponse"}}}
        default: {$ref: "#/components/responses/TrainingError"}
  /api/v1/organizations/{organizationID}:
    parameters:
      - {$ref: "#/components/parameters/OrganizationID"}
    patch:
      tags: [Organizaciones]
      summary: Editar organización y tipo de establecimiento
      operationId: updateOrganization
      description: ADMIN del tenant o SUPER_ADMIN. Reemplazo completo de campos editables con control optimista por rowVersion (409 VERSION_CONFLICT). Requiere V12. Ver specs/ORGANIZATIONS.md.
      security: [{FirebaseBearer: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/OrganizationUpdateRequest"}}}
      responses:
        "200": {description: Organización actualizada, content: {application/json: {schema: {type: object, required: [data], properties: {data: {$ref: "#/components/schemas/AccountOrganization"}}}}}}
        default: {$ref: "#/components/responses/WorkspaceError"}
  /api/v1/organizations/{organizationID}/locations/{locationID}:
    parameters:
      - {$ref: "#/components/parameters/OrganizationID"}
      - {name: locationID, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      tags: [Organizaciones]
      summary: Editar sede (nombre, dirección, zona horaria, activa/inactiva)
      operationId: updateLocation
      description: ADMIN del tenant o SUPER_ADMIN. Control optimista por rowVersion. Se audita location.updated.
      security: [{FirebaseBearer: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/LocationUpdateRequest"}}}
      responses:
        "200": {description: Sede actualizada, content: {application/json: {schema: {type: object, required: [data], properties: {data: {$ref: "#/components/schemas/AccountLocation"}}}}}}
        default: {$ref: "#/components/responses/WorkspaceError"}
  /api/v1/organizations/{organizationID}/members/{userID}:
    parameters:
      - {$ref: "#/components/parameters/OrganizationID"}
      - {name: userID, in: path, required: true, schema: {type: string, maxLength: 128}}
    patch:
      tags: [Organizaciones]
      summary: Editar rol y sedes de un miembro
      operationId: updateMember
      description: ADMIN del tenant o SUPER_ADMIN. Nunca deja la organización sin ADMIN activo (409 LAST_ADMIN_REQUIRED).
      security: [{FirebaseBearer: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false, required: [role, locationIds, rowVersion], properties: {role: {type: string, enum: [ADMIN, CHEF, WORKER]}, locationIds: {type: array, maxItems: 100, items: {type: string, format: uuid}}, rowVersion: {type: integer, minimum: 1}}}}}
      responses:
        "200": {description: Miembro actualizado, content: {application/json: {schema: {type: object, required: [data], properties: {data: {$ref: "#/components/schemas/AccountMember"}}}}}}
        default: {$ref: "#/components/responses/WorkspaceError"}
  /api/v1/organizations/{organizationID}/members/{userID}/deactivate:
    parameters:
      - {$ref: "#/components/parameters/OrganizationID"}
      - {name: userID, in: path, required: true, schema: {type: string, maxLength: 128}}
    post:
      tags: [Organizaciones]
      summary: Dar de baja lógica a un miembro
      operationId: deactivateMember
      description: Baja lógica idempotente; retira dispositivos del tenant y revoca sesiones si no tiene otra membresía activa.
      security: [{FirebaseBearer: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/RowVersionRequest"}}}
      responses:
        "200": {description: Miembro inactivo, content: {application/json: {schema: {type: object, required: [data], properties: {data: {$ref: "#/components/schemas/AccountMember"}}}}}}
        default: {$ref: "#/components/responses/WorkspaceError"}
  /api/v1/organizations/{organizationID}/members/{userID}/reactivate:
    parameters:
      - {$ref: "#/components/parameters/OrganizationID"}
      - {name: userID, in: path, required: true, schema: {type: string, maxLength: 128}}
    post:
      tags: [Organizaciones]
      summary: Reactivar a un miembro
      operationId: reactivateMember
      security: [{FirebaseBearer: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/RowVersionRequest"}}}
      responses:
        "200": {description: Miembro activo, content: {application/json: {schema: {type: object, required: [data], properties: {data: {$ref: "#/components/schemas/AccountMember"}}}}}}
        default: {$ref: "#/components/responses/WorkspaceError"}
  /api/v1/organizations/{organizationID}/members/{userID}/transfer-admin:
    parameters:
      - {$ref: "#/components/parameters/OrganizationID"}
      - {name: userID, in: path, required: true, schema: {type: string, maxLength: 128}}
    post:
      tags: [Organizaciones]
      summary: Transferir la administración al miembro indicado
      operationId: transferAdmin
      description: El destino pasa a ADMIN y quien transfiere pasa a actorRole con actorLocationIds. rowVersion es el del destino.
      security: [{FirebaseBearer: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false, required: [rowVersion], properties: {rowVersion: {type: integer, minimum: 1}, actorRole: {type: string, enum: [CHEF, WORKER]}, actorLocationIds: {type: array, maxItems: 100, items: {type: string, format: uuid}}}}}}
      responses:
        "200": {description: Administración transferida, content: {application/json: {schema: {type: object, required: [data], properties: {data: {type: object, required: [newAdmin, formerAdmin], properties: {newAdmin: {$ref: "#/components/schemas/AccountMember"}, formerAdmin: {nullable: true, allOf: [{$ref: "#/components/schemas/AccountMember"}]}}}}}}}}
        default: {$ref: "#/components/responses/WorkspaceError"}
  /api/v1/organizations/{organizationID}/invitations:
    parameters:
      - {$ref: "#/components/parameters/OrganizationID"}
    get:
      tags: [Organizaciones]
      summary: Listar invitaciones
      operationId: listInvitations
      description: ADMIN del tenant o SUPER_ADMIN. Filtro opcional status, query, pageSize y pageToken.
      security: [{FirebaseBearer: []}]
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [PENDING, ACCEPTED, REVOKED, EXPIRED]}}
        - {name: query, in: query, schema: {type: string, maxLength: 160}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
        - {name: pageToken, in: query, schema: {type: string, maxLength: 2048}}
      responses:
        "200": {description: Página de invitaciones, content: {application/json: {schema: {type: object, required: [data, pagination], properties: {data: {type: array, items: {$ref: "#/components/schemas/Invitation"}}, pagination: {$ref: "#/components/schemas/Pagination"}}}}}}
        default: {$ref: "#/components/responses/WorkspaceError"}
    post:
      tags: [Organizaciones]
      summary: Invitar a una persona por correo
      operationId: createInvitation
      description: "Token aleatorio de un solo uso (solo se guarda su hash), vigencia 7 días. Devuelve `acceptUrl` (URL de aceptación con el token, de INVITATION_ACCEPT_URL) para compartir por WhatsApp; sin esa variable `acceptUrl` es null y se devuelve `token`. Solo esta respuesta y el reenvío lo incluyen; nunca la lista. El correo sale por outbox/Resend solo si hay proveedor configurado; sin él la invitación se crea igual. Mismo id y contenido repite 200 sin duplicar y sin enlace."
      security: [{FirebaseBearer: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false, required: [id, email, role], properties: {id: {type: string, format: uuid}, email: {type: string, format: email, maxLength: 320}, role: {type: string, enum: [ADMIN, CHEF, WORKER]}, locationIds: {type: array, maxItems: 100, items: {type: string, format: uuid}}}}}}
      responses:
        "200": {description: Repetición idéntica, content: {application/json: {schema: {type: object, required: [data], properties: {data: {$ref: "#/components/schemas/Invitation"}}}}}}
        "201": {description: Invitación creada con enlace compartible, content: {application/json: {schema: {type: object, required: [data], properties: {data: {$ref: "#/components/schemas/InvitationIssued"}}}}}}
        default: {$ref: "#/components/responses/WorkspaceError"}
  /api/v1/organizations/{organizationID}/invitations/{invitationID}/resend:
    parameters:
      - {$ref: "#/components/parameters/OrganizationID"}
      - {name: invitationID, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Organizaciones]
      summary: Reenviar una invitación con un token nuevo
      operationId: resendInvitation
      description: "Invalida el token anterior y devuelve `acceptUrl` (o `acceptUrl: null` y `token` sin INVITATION_ACCEPT_URL). 429 INVITATION_RESEND_TOO_SOON dentro del minuto siguiente al último envío."
      security: [{FirebaseBearer: []}]
      responses:
        "200": {description: Invitación reenviada con enlace compartible, content: {application/json: {schema: {type: object, required: [data], properties: {data: {$ref: "#/components/schemas/InvitationIssued"}}}}}}
        default: {$ref: "#/components/responses/WorkspaceError"}
  /api/v1/organizations/{organizationID}/invitations/{invitationID}/revoke:
    parameters:
      - {$ref: "#/components/parameters/OrganizationID"}
      - {name: invitationID, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Organizaciones]
      summary: Revocar una invitación
      operationId: revokeInvitation
      security: [{FirebaseBearer: []}]
      responses:
        "200": {description: Invitación revocada, content: {application/json: {schema: {type: object, required: [data], properties: {data: {$ref: "#/components/schemas/Invitation"}}}}}}
        default: {$ref: "#/components/responses/WorkspaceError"}
  /api/v1/invitations/accept:
    post:
      tags: [Organizaciones]
      summary: Aceptar una invitación
      operationId: acceptInvitation
      description: Requiere sesión verificada cuyo correo coincida con el invitado (403 INVITATION_EMAIL_MISMATCH). Errores 404 INVITATION_NOT_FOUND, 409 INVITATION_EXPIRED, INVITATION_ALREADY_USED, INVITATION_REVOKED.
      security: [{FirebaseBearer: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false, required: [token], properties: {token: {type: string, minLength: 43, maxLength: 43}}}}}
      responses:
        "200": {description: Membresía creada, content: {application/json: {schema: {type: object, required: [data], properties: {data: {type: object, required: [organizationId, role, locationIds], properties: {organizationId: {type: string}, role: {type: string, enum: [ADMIN, CHEF, WORKER]}, locationIds: {type: array, items: {type: string, format: uuid}}}}}}}}}
        default: {$ref: "#/components/responses/WorkspaceError"}
  /api/v1/me/devices:
    get:
      tags: [Organizaciones]
      summary: Listar mis dispositivos registrados
      operationId: listMyDevices
      description: Solo los dispositivos ACTIVE del usuario autenticado; nunca los de otros ni el token push.
      security: [{FirebaseBearer: []}]
      parameters:
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
        - {name: pageToken, in: query, schema: {type: string, maxLength: 2048}}
      responses:
        "200": {description: Página de dispositivos, content: {application/json: {schema: {type: object, required: [data, pagination], properties: {data: {type: array, items: {$ref: "#/components/schemas/AccountDevice"}}, pagination: {$ref: "#/components/schemas/Pagination"}}}}}}
        default: {$ref: "#/components/responses/WorkspaceError"}
  /api/v1/me/devices/{deviceID}:
    parameters:
      - {name: deviceID, in: path, required: true, schema: {type: string, format: uuid}}
    delete:
      tags: [Organizaciones]
      summary: Revocar un dispositivo propio
      operationId: revokeMyDevice
      description: Idempotente; borra el token push. Un dispositivo ajeno responde 404.
      security: [{FirebaseBearer: []}]
      responses:
        "200": {description: Dispositivo inactivo, content: {application/json: {schema: {type: object, required: [data], properties: {data: {$ref: "#/components/schemas/AccountDevice"}}}}}}
        default: {$ref: "#/components/responses/WorkspaceError"}
  /api/v1/organizations/{organizationID}/research/participation:
    parameters:
    - $ref: "#/components/parameters/OrganizationID"
    get:
      tags: [Investigación]
      operationId: getResearchParticipation
      summary: Estado del participante
      description: "Miembro activo de la organización. Devuelve participante seudónimo, documento de consentimiento vigente, consentimiento y, solo con consentimiento vigente, la encuesta CAP sin respuestas correctas."
      security: [{FirebaseBearer: []}]
      responses:
        "200":
          description: Correcto.
          content: {application/json: {schema: {$ref: "#/components/schemas/ResearchObjectResponse"}}}
        default: {$ref: "#/components/responses/ResearchError"}
  /api/v1/organizations/{organizationID}/research/consent:
    parameters:
    - $ref: "#/components/parameters/OrganizationID"
    post:
      tags: [Investigación]
      operationId: recordResearchConsent
      summary: Aceptar o revocar el consentimiento
      description: "Aceptar exige la versión vigente del documento (409 RESEARCH_CONSENT_VERSION_OUTDATED) y crea al participante con un código seudónimo. Revocar retira al participante (WITHDRAWN). Idempotente."
      security: [{FirebaseBearer: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ResearchConsentRequest"}}}
      responses:
        "200":
          description: Correcto.
          content: {application/json: {schema: {$ref: "#/components/schemas/ResearchObjectResponse"}}}
        default: {$ref: "#/components/responses/ResearchError"}
  /api/v1/organizations/{organizationID}/research/submissions:
    parameters:
    - $ref: "#/components/parameters/OrganizationID"
    post:
      tags: [Investigación]
      operationId: submitResearchSurvey
      summary: Enviar PRETEST o POSTTEST
      description: "Exige consentimiento vigente, la versión CAP publicada y una sola entrega por participante, versión y momento. 201 la primera vez; 200 en repetición idéntica; 409 IDEMPOTENCY_CONFLICT, RESEARCH_SUBMISSION_EXISTS o RESEARCH_VERSION_OUTDATED. El servidor calcula los puntajes."
      security: [{FirebaseBearer: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ResearchSubmissionRequest"}}}
      responses:
        "201":
          description: Entrega registrada.
          content: {application/json: {schema: {$ref: "#/components/schemas/ResearchObjectResponse"}}}
        default: {$ref: "#/components/responses/ResearchError"}
  /api/v1/research/access:
    get:
      tags: [Investigación]
      operationId: getResearchAccess
      summary: Permisos de investigación del usuario
      description: "Cualquier usuario autenticado. canResearch depende de la concesión de plataforma, no de roles de empresa."
      security: [{FirebaseBearer: []}]
      responses:
        "200":
          description: Correcto.
          content: {application/json: {schema: {$ref: "#/components/schemas/ResearchObjectResponse"}}}
        default: {$ref: "#/components/responses/ResearchError"}
  /api/v1/research/access-grants:
    get:
      tags: [Investigación]
      operationId: listResearchGrants
      summary: Listar concesiones
      description: "Solo SUPER_ADMIN. Paginado por cursor."
