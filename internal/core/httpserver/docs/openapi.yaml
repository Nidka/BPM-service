      description: "Investigador; cada exportación se audita. Solo código seudónimo, empresa, momento, fecha, versión, respuestas y puntajes; sin correo, UID ni nombres. Máximo 20000 filas (422 RESEARCH_EXPORT_TOO_LARGE)."
      security: [{FirebaseBearer: []}]
      parameters:
      - {in: query, name: instrumentVersionId, schema: {type: string, format: uuid}}
      - {in: query, name: organizationId, schema: {type: string}}
      responses:
        "200":
