    OperationPlanToday:
      type: object
      additionalProperties: false
      description: Plan activo con su estado en el período en curso; solo con `view=today`.
      required: ["id", "locationId", "area", "task", "instructions", "productName", "frequency", "dueTime", "active", "today"]
      properties:
        id: {"type": "string", "format": "uuid"}
        locationId: {"type": "string", "format": "uuid"}
        area: {"type": "string", "maxLength": 100, "minLength": 2}
        task: {"type": "string", "maxLength": 240, "minLength": 2}
        instructions: {"type": "string", "maxLength": 2000}
        productName: {"type": "string", "maxLength": 160}
        frequency: {"type": "string", "enum": ["PER_SHIFT", "DAILY", "WEEKLY", "MONTHLY"]}
        dueTime: {"type": "string", "maxLength": 5, "description": "Vacío o HH:mm, hora local de la sede."}
        active: {"type": "boolean", "enum": [true]}
        today:
          type: object
          additionalProperties: false
          required: [periodStartsAt, periodEndsAt, timezone, done, doneByMe, lastExecutionId, lastResult, lastExecutedAt, overdue, shift]
          properties:
            periodStartsAt: {type: string, format: date-time, description: "Inicio (inclusivo) UTC del período: día, semana desde el lunes o mes en la zona de la sede; en PER_SHIFT, la ocurrencia del turno evaluado. Sin turnos, el día local."}
            periodEndsAt: {type: string, format: date-time, description: "Fin (excluyente) UTC del período."}
            timezone: {type: string, description: "Zona IANA de la sede (America/Lima si la guardada no es válida)."}
            done: {type: boolean, description: "Existe una ejecución COMPLETED u OBSERVED del plan en el período, de cualquier persona de la sede (en PER_SHIFT, registrada con el turno evaluado)."}
            doneByMe: {type: boolean, description: "La ejecución COMPLETED u OBSERVED es de quien consulta."}
            lastExecutionId: {type: string, nullable: true, format: uuid, description: "Última ejecución propia dentro del período."}
            lastResult: {type: string, nullable: true, enum: [COMPLETED, NOT_COMPLETED, OBSERVED, null]}
            lastExecutedAt: {type: string, nullable: true, format: date-time}
            overdue: {type: boolean, description: "No hecho y la hora local de la sede supera dueTime (solo DAILY y PER_SHIFT con dueTime; un turno que aún no empieza no vence)."}
            shift:
              type: object
              nullable: true
              additionalProperties: false
              description: Turno evaluado en PER_SHIFT; null en otras frecuencias o sin turnos activos.
              required: [id, name, state]
              properties:
                id: {type: string, format: uuid}
                name: {type: string}
                state: {type: string, enum: [OPEN, UPCOMING, CLOSED]}
